    volumes:
    - /opt/brain/settings/automation/egress.conf:/etc/squid/squid.conf:ro
    expose:
    - '3128'
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test:
      - CMD-SHELL
      - squid -k check || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  automation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
    - automation
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: ${AUTOMATION_DB_PASSWORD}
    volumes:
    - automation-db:/var/lib/postgresql/data
    expose:
    - '5432'
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U activepieces -d activepieces
      interval: 10s
      timeout: 5s
      retries: 10
  record-matcher:
    image: ${MATCHER_IMAGE:?set MATCHER_IMAGE; build matcher/Dockerfile, no image is published}
    restart: 'no'
    command:
    - python
    - -m
    - brain.resolution.splink_job
    - --export
    - /exports/export.duckdb
    - --suggestions
    - /suggestions
    networks:
    - matcher
    environment:
      MALLOC_ARENA_MAX: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    volumes:
    - matcher-exports:/exports:ro
    - matcher-suggestions:/suggestions
    deploy:
      resources:
        limits:
          memory: 1024M
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    restart: unless-stopped
    environment:
      PORT: '3000'
      WORKERS: '1'
    networks:
    - pii
    expose:
    - '3000'
    healthcheck:
      test:
      - CMD-SHELL
      - 'curl -fsS -m 8 -H ''Content-Type: application/json'' -d ''{"text":"card 4111111111111111","language":"en","entities":["CREDIT_CARD"]}'' http://127.0.0.1:3000/analyze | grep -q CREDIT_CARD'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1536M
networks:
  default: null
  tool-api:
    name: brain-tool-api
    internal: true
  pii:
    internal: true
  identity:
    internal: true
  proxy:
    external: true
    name: coolify
  inference:
    internal: true
  automation:
    internal: true
  egress: null
  matcher:
    internal: true
volumes:
  brain-db: null
  seaweedfs: null
  keycloak-db: null
  realm-import: null
  keycloak-vault: null
  langfuse-clickhouse: null
  inference-models: null
  automation-db: null
  matcher-exports: null
  matcher-suggestions: null

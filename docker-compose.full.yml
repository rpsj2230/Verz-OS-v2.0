      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
    - postgres
    - -c
    - shared_buffers=64MB
    - -c
    - work_mem=4MB
    - -c
    - max_connections=30
    volumes:
    - keycloak-db:/var/lib/postgresql
    networks:
    - identity
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U keycloak -d keycloak
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
  keycloak-realm:
    image: ${APP_IMAGE:?set APP_IMAGE to the image and release tag this install runs}
    restart: 'no'
    command:
    - python
    - -c
    - "from pathlib import Path\nfrom brain.ops.realm_import import importable_realm\nout = Path(\"/out/realm-export.json\")\nout.write_text(\n    importable_realm(Path(\"/app/ops/keycloak/realm-export.json\")), encoding=\"utf-8\"\n)\nprint(f\"wrote {out} for --import-realm\")\n"
    environment:
      INSTALL_OIDC_REDIRECT_URIS: ${INSTALL_OIDC_REDIRECT_URIS:?set INSTALL_OIDC_REDIRECT_URIS}
      INSTALL_OIDC_REALM: ${INSTALL_OIDC_REALM:-}
      INSTALL_OIDC_CLIENT_ID: ${INSTALL_OIDC_CLIENT_ID:-}
      INSTALL_BROKERED_DIRECTORY: ${INSTALL_BROKERED_DIRECTORY:-}
      INSTALL_BROKERED_CLIENT_ID: ${INSTALL_BROKERED_CLIENT_ID:-}
      INSTALL_STAFF_SOURCE: ${INSTALL_STAFF_SOURCE:-}
      INSTALL_STAFF_SOURCE_LOCATION: ${INSTALL_STAFF_SOURCE_LOCATION:-}
    volumes:
    - realm-import:/out
    networks:
    - identity
    deploy:
      resources:
        limits:
          memory: 128M
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully
    command:
    - start
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault
      KC_DB_POOL_MAX_SIZE: '15'
      KC_DB_POOL_MIN_SIZE: '2'
      KC_DB_POOL_INITIAL_SIZE: '2'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: 'true'
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_APPEND: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40
    volumes:
    - realm-import:/opt/keycloak/data/import:ro
    - keycloak-vault:/opt/keycloak/vault:ro
    networks:
    - identity
    - proxy
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - 'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && grep -q ''"status": "UP"'' <&3'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M
  langfuse-web:
    image: langfuse/langfuse:3

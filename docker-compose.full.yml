    command:
    - python
    - -m
    - brain.ops.worker
    environment:
      BRAIN_WORKER_COMPONENT: brain-parse-worker
      QUEUE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer-session:5432/brain
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer:5432/brain
      BRAIN_WORKER_SLOTS_HUMAN_INTERACTIVE: '0'
      BRAIN_WORKER_SLOTS_HUMAN_ASYNC: '0'
      BRAIN_WORKER_SLOTS_AUTOMATION: '0'
      BRAIN_WORKER_SLOTS_SYSTEM: '1'
      BRAIN_WORKER_SLOT_CLASS: whole_container
      BRAIN_WORKER_POOL_MAX: '5'
      MALLOC_ARENA_MAX: '2'
      PYTHONUNBUFFERED: '1'
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - brain.ops.worker
      - --ready
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 192MiB
    command:
    - server
    - -dir=/data
    - -s3
    - -s3.port=8333
    - -s3.config=/etc/seaweedfs/s3.json
    - -master.volumeSizeLimitMB=1024
    - -volume.index=leveldb
    volumes:
    - seaweedfs:/data
    - /opt/brain/settings/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    expose:
    - '8333'
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8333/status
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.80
    restart: 'no'
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - /opt/provision.sh
    environment:
      WEED_MASTER: seaweedfs:9333
    volumes:
    - /opt/brain/settings/seaweedfs/provision.sh:/opt/provision.sh:ro
    deploy:
      resources:
        limits:
          memory: 64M
  keycloak-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:

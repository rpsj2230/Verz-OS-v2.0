      resources:
        limits:
          memory: 1024M
    networks:
    - default
    - tool-api
    - pii
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: brain
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: brain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '20'
      AUTH_TYPE: scram-sha-256
      AUTH_QUERY: SELECT rolname, CASE WHEN rolvaliduntil < now() THEN NULL ELSE rolpassword END FROM pg_authid WHERE rolname = $$1 AND rolcanlogin AND NOT rolsuper AND NOT rolbypassrls
    expose:
    - '5432'
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p 5432 -U brain
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: brain
    volumes:
    - brain-db:/var/lib/postgresql
    expose:
    - '5432'
    command: 'postgres -c shared_buffers=512MB -c work_mem=16MB -c maintenance_work_mem=256MB -c autovacuum_work_mem=128MB -c max_connections=100

      '
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U brain -d brain
      interval: 10s
      timeout: 5s
      retries: 10
  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
    - valkey-server
    - --maxmemory
    - 384mb
    - --maxmemory-policy
    - allkeys-lru
    - --save
    - ''
    expose:
    - '6379'
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  brain-worker:
    image: ${APP_IMAGE:?set APP_IMAGE to the image and release tag this install runs}
    restart: unless-stopped
    depends_on:
      pgbouncer-session:
        condition: service_healthy
    command:
    - python
    - -m
    - brain.ops.worker
    environment:
      QUEUE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer-session:5432/brain
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer:5432/brain
      BRAIN_CHECKPOINTER_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer-session:5432/brain
      BRAIN_WORKER_SLOTS_HUMAN_INTERACTIVE: '0'
      BRAIN_WORKER_SLOTS_HUMAN_ASYNC: '4'
      BRAIN_WORKER_SLOTS_AUTOMATION: '2'
      BRAIN_WORKER_SLOTS_SYSTEM: '1'
      BRAIN_WORKER_SLOT_CLASS: standard
      BRAIN_WORKER_POOL_MAX: '15'
      MALLOC_ARENA_MAX: '2'
      PYTHONUNBUFFERED: '1'
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - brain.ops.worker
      - --ready
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
  pgbouncer-session:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: brain
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: brain
      POOL_MODE: session
      DEFAULT_POOL_SIZE: '20'
      MAX_DB_CONNECTIONS: '20'
      MAX_CLIENT_CONN: '24'
      QUERY_WAIT_TIMEOUT: '30'
      AUTH_TYPE: scram-sha-256
      AUTH_QUERY: SELECT rolname, CASE WHEN rolvaliduntil < now() THEN NULL ELSE rolpassword END FROM pg_authid WHERE rolname = $$1 AND rolcanlogin AND NOT rolsuper AND NOT rolbypassrls
    expose:
    - '5432'
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p 5432 -U brain
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  brain-parse-worker:
    image: ${APP_IMAGE:?set APP_IMAGE to the image and release tag this install runs}

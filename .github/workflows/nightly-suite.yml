name: Nightly suite

# The whole unit suite against main, every night. A pull request runs only the files its diff can
# reach (brain.ops.test_plan, switched on 2026-10-13), so this is what keeps every file running
# at least once a day, what a selection that missed something is found by, and where the coverage
# floor is held for the whole suite. The shard job is the pull request's, step for step: it gets
# no base commit, which brain.ops.test_plan reads as "run everything", and
# tests/unit/test_test_selection.py holds the two equal and the base absent.
# Named apart from CI on purpose: Deploy listens for CI completing on main, and a nightly run must
# never deploy anything.

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.9"

jobs:
  tests:
    name: Unit tests, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # A red shard does not cancel the others, so one run reports every failure in the suite
      # rather than the first shard's. Eight since 2026-09-28: four took 9 to 12 minutes each and
      # were the whole critical path of every pull request and of every deploy.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        # CI has a database before the laptop does, so the DB-dependent suites run here
        # from the first commit rather than waiting on local tooling.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brain_test
      # Named for the shard, so the four files arrive at the `coverage` job side by side
      # rather than overwriting one another. Absolute, so a test that changes directory
      # still writes where the upload looks.
      COVERAGE_FILE: ${{ github.workspace }}/coverage-shard-${{ matrix.shard }}
      # TEST_SELECTION_BASE is deliberately not set here: with no base the plan is the whole suite.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default is a shallow clone of one commit, and every
          # check in this job that reads `Closes:` trailers then computes against an
          # almost empty set: the traceability sweep passed here while verifying
          # nothing about commit claims, and a test that reads real history failed
          # for a reason that did not exist on any laptop.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          # The automation piece is compiled and loaded by a unit test,
          # `test_automation_piece_package.py`, and its tests run on Node's own type
          # stripping, which needs 22.18 or later. That test fails on a runner rather than
          # skipping, so without these two steps this job goes red instead of quietly
          # testing less.
          node-version: '22'
          cache: npm
          cache-dependency-path: ops/automation/piece/package-lock.json
      - name: Install the automation piece's toolchain from its lockfile
        working-directory: ops/automation/piece
        run: npm ci --ignore-scripts
      - name: This shard's tests, with coverage recorded
        id: suite
        # The plan is this shard's share of the selected files, or of the whole suite when the
        # selection is not sure (`brain.ops.test_plan` says which and why on stderr). If the plan
        # itself fails to run, the shard falls back to its whole share, which is the old
        # behaviour. `files=$(...)` rather than a pipe, because `bash -e` stops on a failed
        # assignment and does not stop on the left of a pipe. The emptiness check is the one that
        # matters: pytest given no file runs `testpaths`, so an empty list would run the whole
        # suite. An empty share of a selection is a pass, with the reason printed.
        run: |
          mode_file="$GITHUB_WORKSPACE/plan-shard-${{ matrix.shard }}.txt"
          files=$(uv run python -m brain.ops.test_plan --shard ${{ matrix.shard }} --of ${{ strategy.job-total }} --base "$TEST_SELECTION_BASE" --head "$GITHUB_SHA" --mode-file "$mode_file") || {
            echo "::warning::the test selection failed, so shard ${{ matrix.shard }} runs its whole share of the suite"
            echo "mode=full" > "$mode_file"
            files=$(uv run python -m brain.ops.test_shards --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})
          }
          if [ -z "$files" ] && grep -q '^mode=selected$' "$mode_file"; then
            echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }} has nothing to run: the files selected for this change all fall in the other shards"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$files" ] || { echo "::error::shard ${{ matrix.shard }} has no test files"; exit 1; }
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }}: $(echo "$files" | wc -l) file(s)"
          uv run pytest --cov --cov-report= --cov-fail-under=0 $files

      - name: Migrations go forward, back, and forward again
        # A migration that cannot be reversed is a deploy with no way home. This runs the
        # round trip rather than only `upgrade head`, because a downgrade that raises is
        # discovered at 3am otherwise - and it runs upgrade twice, since a migration that
        # is not idempotent breaks the second replica rather than the first.
        env:
          APP_ROLE_PASSWORD: "ci'test\"password"
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current | grep -q "(head)" || { echo "::error::not at head"; exit 1; }
          echo "round trip clean"

      - name: The schema is what the migration says it is
        run: |
          # The list and the count both come from brain.db.SCHEMAS. They used to be written
          # out here, again in the stack job below, and a third time inside sweep_rls -- and
          # the three had already drifted: the sweep's copy was missing `ops`, so a table
          # with no row-level security in that schema passed the check that exists to find
          # exactly that. A hard-coded count also fails on a correct change, which is a test
          # somebody updates without reading.
          uv run python -m brain.ops.schema_check "$DATABASE_URL"
          psql "$DATABASE_URL" -tAc "select rolname, rolbypassrls from pg_roles where rolname like 'brain%'"
          b=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_roles where rolname like 'brain%' and rolbypassrls" | tr -d '[:space:]')
          [ "$b" = "0" ] || { echo "::error::a brain role can bypass row-level security"; exit 1; }
          echo "no role bypasses RLS"

      - name: Keep this shard's coverage data for the floor
        # Not kept by a shard that ran nothing: there is no data to keep, and the floor is only
        # held over a run in which every shard ran the whole suite.
        if: ${{ steps.suite.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          if-no-files-found: error
          # A re-run of a shard uploads under the same name, and without this the second
          # upload is refused and the re-run goes red for a reason that is not a test.
          overwrite: true
          retention-days: 7

      - name: Keep this shard's plan, whether it ran everything
        uses: actions/upload-artifact@v4
        with:
          name: plan-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/plan-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The coverage floor over the whole suite, held here every night because a pull request's run
  # is partial whenever it was selected. Same steps as the pull request's `coverage` job once it
  # has found every shard ran everything; here that is a requirement and not a discovery.
  coverage:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ !cancelled() }}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.tests.result }}
        run: |
          [ "$SHARDS" = "success" ] || { echo "::error::the unit test shards ended in $SHARDS"; exit 1; }
          echo "every shard passed"
      - uses: actions/download-artifact@v4
        with:
          pattern: plan-shard-*
          path: ${{ runner.temp }}/plan-data
          merge-multiple: true
      - name: Every shard ran the whole suite
        run: |
          total=$(find "${{ runner.temp }}/plan-data" -name 'plan-shard-*.txt' | wc -l | tr -d '[:space:]')
          full=$({ grep -lx 'mode=full' "${{ runner.temp }}/plan-data"/plan-shard-*.txt || true; } | wc -l | tr -d '[:space:]')
          [ "$total" -gt 0 ] && [ "$full" = "$total" ] || { echo "::error::$full of $total shards ran the whole suite, and the nightly must run all of it"; exit 1; }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Coverage floor over the whole suite
        run: |
          plans=$(find "${{ runner.temp }}/plan-data" -name 'plan-shard-*.txt' | wc -l | tr -d '[:space:]')
          data=$(find coverage-data -name 'coverage-shard-*' | wc -l | tr -d '[:space:]')
          [ "$plans" = "$data" ] || { echo "::error::$plans shards ran and $data left coverage data"; exit 1; }
          uv run coverage combine coverage-data/coverage-shard-*
          uv run coverage report

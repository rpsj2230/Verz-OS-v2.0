name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.9"

jobs:
  # Everything that needs no database. Fast, so it fails first.
  static:
    name: Lint, types, invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types (strict)
        run: uv run mypy
      - name: Invariants
        # These encode rules that must never break. A failure here blocks the deploy,
        # and the job is named so a red check says which rule broke.
        run: uv run pytest tests/invariants -q

  tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        # CI has a database before the laptop does, so the DB-dependent suites run here
        # from the first commit rather than waiting on local tooling.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brain_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default is a shallow clone of one commit, and every
          # check in this job that reads `Closes:` trailers then computes against an
          # almost empty set: the traceability sweep passed here while verifying
          # nothing about commit claims, and a test that reads real history failed
          # for a reason that did not exist on any laptop.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Tests with coverage floor
        run: uv run pytest --cov --cov-report=term-missing

      - name: Migrations go forward, back, and forward again
        # A migration that cannot be reversed is a deploy with no way home. This runs the
        # round trip rather than only `upgrade head`, because a downgrade that raises is
        # discovered at 3am otherwise - and it runs upgrade twice, since a migration that
        # is not idempotent breaks the second replica rather than the first.
        env:
          APP_ROLE_PASSWORD: "ci'test\"password"
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current | grep -q "(head)" || { echo "::error::not at head"; exit 1; }
          echo "round trip clean"

      - name: The schema is what the migration says it is
        run: |
          # The list and the count both come from brain.db.SCHEMAS. They used to be written
          # out here, again in the stack job below, and a third time inside sweep_rls -- and
          # the three had already drifted: the sweep's copy was missing `ops`, so a table
          # with no row-level security in that schema passed the check that exists to find
          # exactly that. A hard-coded count also fails on a correct change, which is a test
          # somebody updates without reading.
          uv run python -m brain.ops.schema_check "$DATABASE_URL"
          psql "$DATABASE_URL" -tAc "select rolname, rolbypassrls from pg_roles where rolname like 'brain%'"
          b=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_roles where rolname like 'brain%' and rolbypassrls" | tr -d '[:space:]')
          [ "$b" = "0" ] || { echo "::error::a brain role can bypass row-level security"; exit 1; }
          echo "no role bypasses RLS"

  sweeps:
    name: Schema and registry sweeps
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default is a shallow clone of one commit, and every
          # check in this job that reads `Closes:` trailers then computes against an
          # almost empty set: the traceability sweep passed here while verifying
          # nothing about commit claims, and a test that reads real history failed
          # for a reason that did not exist on any laptop.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Row-level security on every entity table
        run: uv run python -m brain.ops.sweeps rls
      - name: No foreign key from a grant table to a connector table
        run: uv run python -m brain.ops.sweeps grant_isolation
      - name: Tool naming grammar
        run: uv run python -m brain.ops.sweeps tool_registry
      - name: One tool-name grammar, not four
        # There were three copies and they disagreed, so a name that passed validation and
        # passed CI was refused at registration. This catches the next copy at the moment
        # somebody writes it rather than the day the two halves are asked the same thing.
        run: uv run python -m brain.ops.sweeps one_tool_grammar
      - name: Client independence — no client value, and one reader
        # M41.1.8. On every commit rather than once before a second client, so the final
        # audit verifies a gate that has been green all along instead of cleaning a year of
        # drift. A blocklist of the first client's names would pass for the second client;
        # this refuses value shapes and second readers, which hold for a client nobody has met.
        run: uv run python -m brain.ops.sweeps client_independence
      - name: Traceability — nothing claimed without a test id
        run: uv run python -m brain.ops.sweeps traceability
      - name: Slug collisions — one name means one thing
        # Scopes and agents are rows that mostly do not exist yet, so this compares little
        # today and says so in its output rather than printing a bare "ok". A sweep that
        # reports success over an empty comparison is how `traceability` spent its whole
        # life green while checking nothing.
        run: uv run python -m brain.ops.sweeps slug_collisions
      - name: An install from empty builds the whole schema and reads nothing else
        # The half of M41.2.1 that needs no database: one revision chain reaching an empty
        # database, every schema and extension `brain.db` declares created by some migration,
        # and every table created with row-level security enabled in the same migration. The
        # other half runs in the `install` job below, against a database this built.
        run: uv run python -m brain.ops.sweeps install_from_empty
      - name: Migration policy
        # Autogenerate is very often nearly right, and nearly right passes review. These
        # are the three ways it is wrong that a diff does not show: a rename written as a
        # drop plus an add, a not-null column with no default, and schema mixed with data.
        run: uv run python -m brain.ops.migration_policy

  # The console's guards ran nowhere but a laptop until 2026-09-07.
  #
  # Found by an agent building the matrix screen, and it is the largest hole this pipeline
  # has had: 266 tests, a strict type check, an import-boundary check and a production build,
  # none of them run by anything except the person who happened to remember. Every one of the
  # console's checks against the Python side is in that set, including the ones that read a
  # route's declared query parameters out of the generated document, which is exactly the
  # class of check that exists because the two halves drift silently.
  #
  # `api:generate` runs the Python exporter first, so this job needs both toolchains. That is
  # also the point of running it here rather than trusting a committed schema:
  # `src/api/generated/` is gitignored precisely so the console cannot compile against an API
  # that no longer exists, and a job that skipped regeneration would restore that hazard with
  # extra steps.
  console:
    name: Console types, boundaries, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        working-directory: console
        run: npm ci
      - name: Generate the typed client from the live application
        working-directory: console
        run: npm run api:generate
      - name: Types (strict)
        working-directory: console
        run: npm run typecheck
      - name: Import boundaries
        working-directory: console
        run: npm run check:boundaries
      - name: Tests
        working-directory: console
        run: npm run test -- --run
      - name: Build
        working-directory: console
        run: npm run build

  docs:
    name: Tracker matches the WBS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and diff
        # The committed tracker must be reproducible from the WBS. If someone edits the
        # generated HTML by hand, this fails rather than letting the two drift apart.
        run: |
          node docs/wbs/export.js
          node docs/wbs/render.js
          git diff --exit-code -- docs/tracker.html docs/wbs.json             || { echo "::error::docs/tracker.html is out of date - run node docs/wbs/render.js"; exit 1; }

  # M41.2.5. An install into a scratch container, from a database with nothing in it, ending
  # in a question that gets answered.
  #
  # **Deliberately not a step in the `tests` job, which also has a database.** That one runs
  # the unit suite first, and the suite creates whatever it needs; by the time a migration ran
  # there the database would not be empty, and "install from empty" would be a claim about a
  # database somebody else had already touched. This job runs nothing before the migrations,
  # its own service container is created for it and destroyed after it, and the first step
  # asserts the database really is empty rather than assuming a fresh container is.
  #
  # Every value the last steps compare against is derived from `brain.demo` rather than typed
  # here: a literal in a workflow is a second copy of the demo that nothing keeps in step, and
  # it drifts by going on asserting a value the demo no longer holds.
  install:
    name: Install from empty and answer one question
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          # A credential for a container created and destroyed inside this job, unreachable
          # from outside the runner. `brain.firstrun.credential_default_gaps` reads the
          # deployment configuration and deliberately not this file, for that reason.
          POSTGRES_PASSWORD: install-from-empty
          POSTGRES_DB: brain_install
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:install-from-empty@localhost:5432/brain_install
      APP_ROLE_PASSWORD: "install'from\"empty"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked

      - name: The database really is empty before anything runs
        # Asserted rather than assumed. A job that installs into a database somebody already
        # migrated proves nothing at all, and the failure is silent: everything downstream
        # passes because the schema was already there.
        run: |
          n=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_namespace where nspname not like 'pg_%' and nspname not in ('information_schema','public')" | tr -d '[:space:]')
          [ "$n" = "0" ] || { echo "::error::the scratch database already has $n schema(s)"; exit 1; }
          echo "empty: no application schema present"

      - name: Migrations build the whole schema from nothing
        run: uv run alembic upgrade head

      - name: Every schema the code expects is there
        run: uv run python -m brain.ops.schema_check

      - name: Row-level security, on a database this job built from empty
        # The produced half of M41.2.1. `brain.ops.sweeps install_from_empty` reads what the
        # migrations declare and runs in the sweeps job with no database; this asks the
        # database that those declarations built. A table can be declared with a policy and
        # still arrive without one if the statement never ran, and only this notices.
        run: |
          uv run python -m brain.ops.sweeps rls
          uv run python -m brain.ops.sweeps grant_isolation

      - name: The demo company loads into the tables the migrations made
        run: uv run python -m brain.seed

      - name: One question, asked and answered end to end
        # The whole point of the job. A migrated, seeded install that has never been asked
        # anything has not been shown to work, and every install bug this repository has had
        # lived in exactly that gap.
        run: uv run python -m brain.seed --smoke

      - name: A question about a record that does not exist answers the same nothing
        # The disclosure rule, on the first screen a new install has. An answer that
        # distinguished "no such client" from "I do not understand" would teach its first user
        # which clients exist.
        run: |
          absent=$(uv run python -m brain.seed --ask "what is the status of Nobody At All")
          unknown=$(uv run python -m brain.seed --ask "what colour is the sky")
          [ "$absent" = "$unknown" ] || { echo "::error::an absent record and an unmatched question answer differently"; exit 1; }
          echo "both answered: $absent"

      - name: Loading the demo a second time changes nothing
        # `ON CONFLICT DO NOTHING`, against a real database rather than against a string.
        run: |
          before=$(psql "$DATABASE_URL" -tAc "select count(*) from auth.principal" | tr -d '[:space:]')
          uv run python -m brain.seed --force
          after=$(psql "$DATABASE_URL" -tAc "select count(*) from auth.principal" | tr -d '[:space:]')
          [ "$before" = "$after" ] || { echo "::error::a repeated load changed the row count from $before to $after"; exit 1; }
          echo "repeat load is a no-op at $after principal(s)"

      - name: The demo can be removed, and leaves nothing behind
        # M41.2.6's smallest testable half. The removal is bounded by the identifiers
        # `brain.demo` declares, so what it must leave behind is everything else.
        run: |
          uv run python -m brain.seed --remove
          left=$(psql "$DATABASE_URL" -tAc "select count(*) from auth.principal" | tr -d '[:space:]')
          [ "$left" = "0" ] || { echo "::error::$left demo principal(s) survived the removal"; exit 1; }
          # The same question the install answered, now expected to answer nothing. `if`
          # rather than `&&` because the default shell is `bash -e` and a failing command in
          # a condition is the one place that does not end the script.
          if uv run python -m brain.seed --smoke; then
            echo "::error::the demo still answers after being removed"
            exit 1
          fi
          echo "after removal the demo answers nothing"

  stack:
    name: The whole stack starts
    runs-on: ubuntu-latest
    # Job level, not step level. Set per-step, the later `docker compose exec` calls run
    # without POSTGRES_PASSWORD and compose resolves it to an empty string - which looks
    # like the migrations never ran rather than like a missing variable.
    env:
      APP_IMAGE: brain:ci
      POSTGRES_PASSWORD: ci-test-password
      BRAIN_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build the image the way production builds it
        run: docker build --build-arg COMMIT_SHA=ci-test -t brain:ci .
      - name: Bring the full stack up
        # Two bugs reached the server that every other job here passed: a Postgres 18
        # volume path that only fails when the container starts, and a Dockerfile that
        # never copied the migrations. Both are invisible to lint, types, tests and
        # sweeps, because the compose file is valid YAML pointing at a real image.
        # Only starting it finds them.
        run: |
          docker compose up -d --wait --wait-timeout 180 || {
            echo "::error::stack did not come up"
            docker compose ps
            docker compose logs --tail 60
            exit 1
          }
      - name: Readiness, not liveness
        run: |
          for i in $(seq 1 30); do
            code=$(docker compose exec -T app python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status)" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::/health/ready returned $code"; docker compose logs --tail 60 app; exit 1; }
      - name: Migrations actually applied
        # The app reports ready only when migrations succeeded, so this asserts the
        # schema exists rather than trusting the health check alone.
        run: |
          echo "--- schemas present ---"
          docker compose exec -T db psql -U brain -d brain -tAc             "select nspname from pg_namespace where nspname not like 'pg_%' and nspname <> 'information_schema' order by 1"
          echo "--- alembic version ---"
          docker compose exec -T db psql -U brain -d brain -tAc             "select version_num from alembic_version" || echo "(no alembic_version table)"
          echo "--- app startup log ---"
          docker compose logs app --tail 25
          # Run inside the container, which is the honest place to ask: it checks the schema
          # list the *running image* expects against the database that image migrated,
          # rather than the list this checkout happens to have. See the tests job for why
          # this is a module and not a shell one-liner.
          docker compose exec -T app python -m brain.ops.schema_check
      - name: Row-level security, against a database that exists
        # THE SWEEP THAT HAD NEVER RUN. `brain.ops.sweeps rls` skips when DATABASE_URL is
        # unset, and the standalone sweeps job has no database service, so for the whole life
        # of this pipeline it printed "skip: DATABASE_URL unset (CI always sets it)" and
        # exited 0. The parenthetical was false in the one place it was read.
        #
        # A skip is right on a laptop, where there is genuinely no database and failing would
        # make the sweep something people stop running. It is wrong here. So the check lives
        # in this job, which has a migrated database, and runs inside the container, which is
        # the honest place to ask: it reads the schema the running image actually built.
        #
        # This is the class of bug the sweep exists to catch. A table shipped with RLS off is
        # one forgotten WHERE clause from returning every row to every caller, and it looks
        # correct in every test that happens to use a wide principal.
        run: |
          docker compose exec -T app python -m brain.ops.sweeps rls
          docker compose exec -T app python -m brain.ops.sweeps grant_isolation

      - name: The documents are served
        run: |
          for path in / /build /build/tracker /admin /api/status.json; do
            code=$(docker compose exec -T app python -c "import urllib.request,sys;print(urllib.request.urlopen('http://127.0.0.1:8000$path',timeout=8).status)" 2>/dev/null || echo 000)
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
      - name: Tear down
        if: always()
        run: docker compose down -v

  supply_chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Licence allowlist, release age, archived check
        # Three components we planned around turned out to be archived while still being
        # widely recommended. This job exists so that is caught by CI and not by a person
        # reading a LICENCE file and forgetting to check whether the project is alive.
        run: uv run python -m brain.ops.sweeps dependencies

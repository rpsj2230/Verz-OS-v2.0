name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. On main a run is never cancelled: every
# merge used to cancel the one before it, so a burst of auto-merges left no run to finish and
# nothing deployed (measured 2026-09-28). GitHub keeps one run going and only the newest waiting,
# so main deploys at least once per run's length and the newest commit is never skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.12.9"

jobs:
  # Main runs only what guards the deploy (and the console, when the push touches it). Every pull request has already passed its tests before
  # it merges (the files its diff reaches, or the whole suite for a merge train, see the unit
  # shards below), and the next pull request's run is on top of the newest main, so running
  # the unit shards, console, coverage, handover, analyser and the two supply-chain scans again
  # on main doubled CI for nothing a deploy needs. On the free plan's 20 concurrent jobs that
  # second run queued every deploy (measured 2026-09-28: 22 jobs a run, deploys waiting behind
  # pull requests). Main still runs lint and types, the sweeps, the install from empty, the
  # migrations over an install-shaped database, the previous release on the new schema, the
  # whole stack and the tracker check.
  #
  # Which kind of change this is. A change that touches only the task list (the work breakdown,
  # its compiled JSON, the tracker page, the delivery checklist and the requirements register)
  # cannot change what the product does, so it skips the suites that test the product and runs
  # only the checks that read those files: the plan generates from its sources, every
  # requirement names a task and a proof, and the tests that read task sentences pass. Measured on
  # 2026-09-17: a task-list change waited 15 to 20 minutes per CI run for suites it cannot affect,
  # twice per change (the pull request and main), and the owner asked for it to take minutes.
  #
  # Anything else, or a diff this job cannot compute, is treated as a code change and runs everything.
  changes:
    name: Kind of change
    runs-on: ubuntu-latest
    outputs:
      tasks_only: ${{ steps.kind.outputs.tasks_only }}
      # One per filter in `brain.ops.ci_paths`: whether this diff can affect that job. A diff it
      # cannot compute makes every one true. Read by the pull-request-only jobs and by the console job,
      # which also runs on main.
      dependencies: ${{ steps.paths.outputs.dependencies }}
      image: ${{ steps.paths.outputs.image }}
      presidio: ${{ steps.paths.outputs.presidio }}
      console: ${{ steps.paths.outputs.console }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: kind
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "tasks_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -Evq '^docs/(wbs/(wbs-[a-f]|acts|schedule|progress)\.js|wbs\.json|tracker\.html|delivery-checklist\.md|requirements/register\.json|tracker-audit-[0-9-]+\.md|needs-rupash\.md|architecture\.html)$'; then
            echo "tasks_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "tasks_only=false" >> "$GITHUB_OUTPUT"
          fi
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 src/brain/ops/ci_paths.py --base "$BASE" --head "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
  # Everything that needs no database. Fast, so it fails first.
  static:
    name: Lint, types, invariants
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.tasks_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types (strict)
        run: uv run mypy
      - name: Invariants
        id: invariants
        # These encode rules that must never break. A failure here blocks the deploy,
        # and the job is named so a red check says which rule broke.
        #
        # M37.4.1.2. The report is the evidence that they passed at this commit, which a tick
        # in the interface is not. `brain.ops.invariant_evidence` says where it is kept, what it
        # proves and what it does not, and holds this step and the two after it to that.
        run: uv run pytest tests/invariants -q --junitxml=evidence/invariants.xml
      - name: The invariant report ran every invariant and skipped none
        # pytest exits zero when every test it collected skipped, so the exit status of the step
        # above is not enough to call its report green.
        run: uv run python -m brain.ops.invariant_evidence evidence/invariants.xml
      - name: Keep the invariant report, named for the commit
        # Kept when the suite fails as well, because that is the report naming the rule that
        # broke. Not attempted when the suite never ran, which is what the outcome test is for.
        if: ${{ !cancelled() && steps.invariants.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: invariants-${{ github.sha }}
          path: evidence/invariants.xml
          if-no-files-found: error
          retention-days: 90

  # The unit suite, split into shards that run side by side.
  #
  # It ran as one job until 2026-09-17 and took longer than every other job in CI put together.
  # `brain.ops.test_shards` decides which files each shard runs, from the tree alone, so every
  # runner reaches the same split and every file lands in exactly one shard. Each shard has a
  # database of its own and runs the migration round trip over what its own tests left there.
  #
  # **A pull request runs the files its diff can reach, and the whole suite when it cannot say
  # (2026-10-13).** GitHub's free plan runs 20 jobs at a time, a pull request costs about 20 and
  # 20 to 40 of them were queued, so a run waited over an hour. `brain.ops.test_plan` picks, at
  # import-graph depth 1, the files the diff reaches (`brain.ops.test_selection`, measured over
  # seven real pull requests against these same shards: no miss at depths 0, 1 or 2, including
  # both real failures in those runs) and splits them across the same eight shards. Measured over
  # the last 34 merges to main it runs 31% of the files the full shards ran. **Anything it cannot
  # establish runs the shard's whole share**: no base commit, a diff git cannot compute, a
  # `pyproject.toml` or lock file, a deleted source module, or an error in the planner itself.
  #
  # **Shared test infrastructure no longer runs the whole suite on an ordinary pull request
  # (2026-10-14).** A conftest, a fixture, a test helper, a workflow or the planner's own code used
  # to, and a pull request that fell back cost 127 to 222 job-minutes and 45 to 50 minutes against
  # 56 and 12 for a selected one. They are selected by what reads them now
  # (`brain.ops.test_selection`), and **the whole suite runs in three places instead: on a merge
  # train, which is a pull request whose branch starts with `train/` (`WHOLE_SUITE` below,
  # assembled by `ops/dev/assemble_train.py`), every night (`nightly-suite.yml`), and on demand
  # (that workflow's `workflow_dispatch`)**. They are the floor under the selection and the
  # measurement of it: a red nightly on a file a pull request did not select is the signal to
  # widen the selection, not to trust it. `ops/DEPLOY.md` says what an ordinary pull request no
  # longer proves.
  #
  # **The shards are balanced on recorded durations, not on lines (2026-10-14).** Over the last ten
  # successful pull request runs one shard took 66 to 123 minutes and the other seven 4 to 44,
  # and the slow one changed from run to run, because it was whichever shard held the one test
  # that ran the whole acceptance registry twice (`tests/unit/test_acceptance.py`; the table is in
  # `ops/DEPLOY.md`, "What the unit shards cost"). A line count cannot see a file like that.
  # `brain.ops.test_shards` weighs each file from `ops/ci/test-timings.json`, which
  # `brain.ops.test_timings` regenerates from the JUnit report every shard keeps (the
  # `timing-shard-*` artefact, here and in the nightly suite), and a file with no recorded time
  # falls back to its lines. The job and the check names are unchanged, so no required check moved.
  #
  # **No shard enforces the coverage floor, and that is deliberate.** A quarter of the suite
  # covers a fraction of the code, so each shard passes `--cov-fail-under=0` and keeps its data
  # file instead; the `coverage` job below combines all of them and enforces the floor from
  # `pyproject.toml` over the whole suite, which is the number the floor was always about. **A
  # selected run is partial, so the pull request's `coverage` job holds the floor only when every
  # shard ran the whole suite**, and the nightly suite holds it every night.
  tests:
    name: Unit tests, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tasks_only != 'true' }}
    strategy:
      # A red shard does not cancel the others, so one run reports every failure in the suite
      # rather than the first shard's. Eight since 2026-09-28: four took 9 to 12 minutes each and
      # were the whole critical path of every pull request and of every deploy.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        # CI has a database before the laptop does, so the DB-dependent suites run here
        # from the first commit rather than waiting on local tooling.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brain_test
      # Named for the shard, so the four files arrive at the `coverage` job side by side
      # rather than overwriting one another. Absolute, so a test that changes directory
      # still writes where the upload looks.
      COVERAGE_FILE: ${{ github.workspace }}/coverage-shard-${{ matrix.shard }}
      # What the selection is measured against. The nightly suite runs this same step with no
      # base, which `brain.ops.test_plan` reads as "run everything".
      TEST_SELECTION_BASE: ${{ github.event.pull_request.base.sha }}
      # A merge train (`ops/dev/assemble_train.py`) is a pull request whose branch starts with
      # `train/`, and it runs the whole suite whatever its diff: it is the one run before main
      # that carries every file, and an ordinary pull request no longer falls back to the whole
      # suite for shared test infrastructure (`ops/DEPLOY.md`). Read by the step below as the
      # string "true" or "false"; the nightly suite sets nothing and plans from no base, which is
      # the whole suite too. Nothing but the branch name sets it: no label and no comment.
      WHOLE_SUITE: ${{ startsWith(github.head_ref, 'train/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default is a shallow clone of one commit, and every
          # check in this job that reads `Closes:` trailers then computes against an
          # almost empty set: the traceability sweep passed here while verifying
          # nothing about commit claims, and a test that reads real history failed
          # for a reason that did not exist on any laptop.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          # The automation piece is compiled and loaded by a unit test,
          # `test_automation_piece_package.py`, and its tests run on Node's own type
          # stripping, which needs 22.18 or later. That test fails on a runner rather than
          # skipping, so without these two steps this job goes red instead of quietly
          # testing less.
          node-version: '22'
          cache: npm
          cache-dependency-path: ops/automation/piece/package-lock.json
      - name: Install the automation piece's toolchain from its lockfile
        working-directory: ops/automation/piece
        run: npm ci --ignore-scripts
      - name: This shard's tests, with coverage recorded
        id: suite
        # The plan is this shard's share of the selected files, or of the whole suite when the
        # selection is not sure (`brain.ops.test_plan` says which and why on stderr). If the plan
        # itself fails to run, the shard falls back to its whole share, which is the old
        # behaviour. `files=$(...)` rather than a pipe, because `bash -e` stops on a failed
        # assignment and does not stop on the left of a pipe. The emptiness check is the one that
        # matters: pytest given no file runs `testpaths`, so an empty list would run the whole
        # suite. An empty share of a selection is a pass, with the reason printed.
        run: |
          mode_file="$GITHUB_WORKSPACE/plan-shard-${{ matrix.shard }}.txt"
          whole_flag=""
          if [ "${WHOLE_SUITE:-false}" = "true" ]; then whole_flag="--whole-suite"; fi
          files=$(uv run python -m brain.ops.test_plan --shard ${{ matrix.shard }} --of ${{ strategy.job-total }} --base "$TEST_SELECTION_BASE" --head "$GITHUB_SHA" --mode-file "$mode_file" $whole_flag) || {
            echo "::warning::the test selection failed, so shard ${{ matrix.shard }} runs its whole share of the suite"
            echo "mode=full" > "$mode_file"
            files=$(uv run python -m brain.ops.test_shards --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})
          }
          if [ -z "$files" ] && grep -q '^mode=selected$' "$mode_file"; then
            echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }} has nothing to run: the files selected for this change all fall in the other shards"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$files" ] || { echo "::error::shard ${{ matrix.shard }} has no test files"; exit 1; }
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }}: $(echo "$files" | wc -l) file(s)"
          uv run pytest --cov --cov-report= --cov-fail-under=0 --durations=25 --junitxml="$GITHUB_WORKSPACE/timing-shard-${{ matrix.shard }}.xml" $files

      - name: Migrations go forward, back, and forward again
        # A migration that cannot be reversed is a deploy with no way home. This runs the
        # round trip rather than only `upgrade head`, because a downgrade that raises is
        # discovered at 3am otherwise - and it runs upgrade twice, since a migration that
        # is not idempotent breaks the second replica rather than the first.
        env:
          APP_ROLE_PASSWORD: "ci'test\"password"
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current | grep -q "(head)" || { echo "::error::not at head"; exit 1; }
          echo "round trip clean"

      - name: The schema is what the migration says it is
        run: |
          # The list and the count both come from brain.db.SCHEMAS. They used to be written
          # out here, again in the stack job below, and a third time inside sweep_rls -- and
          # the three had already drifted: the sweep's copy was missing `ops`, so a table
          # with no row-level security in that schema passed the check that exists to find
          # exactly that. A hard-coded count also fails on a correct change, which is a test
          # somebody updates without reading.
          uv run python -m brain.ops.schema_check "$DATABASE_URL"
          psql "$DATABASE_URL" -tAc "select rolname, rolbypassrls from pg_roles where rolname like 'brain%'"
          b=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_roles where rolname like 'brain%' and rolbypassrls" | tr -d '[:space:]')
          [ "$b" = "0" ] || { echo "::error::a brain role can bypass row-level security"; exit 1; }
          echo "no role bypasses RLS"

      - name: Keep this shard's coverage data for the floor
        # Not kept by a shard that ran nothing: there is no data to keep, and the floor is only
        # held over a run in which every shard ran the whole suite.
        if: ${{ steps.suite.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ env.COVERAGE_FILE }}
          if-no-files-found: error
          # A re-run of a shard uploads under the same name, and without this the second
          # upload is refused and the re-run goes red for a reason that is not a test.
          overwrite: true
          retention-days: 7

      - name: Keep this shard's plan, whether it ran everything
        uses: actions/upload-artifact@v4
        with:
          name: plan-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/plan-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Keep this shard's test durations
        # What the shards are balanced on (`brain.ops.test_timings`). Kept when a test failed as
        # well, because a red shard's durations are as true as a green one's, and not when the
        # shard ran nothing. A missing file is a warning and never a reason to fail the shard.
        if: ${{ !cancelled() && steps.suite.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: timing-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/timing-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # The Laravel executor against a real MySQL 8 server (M11.6.1): the one read this product makes of
  # a company's own database, run where a database exists rather than only over a recorded driver.
  # One job and not a matrix. It makes a certificate authority and a server certificate for this
  # run (never committed), starts MySQL with them, makes one schema of views, one the reader has no
  # grant on, one whose view sleeps, and a read-only user, and runs the tests marked `needs_mysql`,
  # which every other job skips: verified TLS against the run's own authority, a certificate no
  # trusted authority signed refused before the login is sent, and the tunnel's unencrypted case.
  # MySQL is started by `docker run` rather than as a service because a service starts before the
  # checkout, so it could not be handed the certificates. It fails when the tests skip here too,
  # because a green job that read nothing is the one result this job exists to rule out.
  laravel_mysql:
    name: Laravel read against MySQL
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tasks_only != 'true' }}
    env:
      LARAVEL_TEST_MYSQL_URL: mysql://brain_reader:ci-reader@127.0.0.1:3306/portal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: A certificate authority and a server certificate for this run
        run: uv run python -m tests.fixtures.tls "$RUNNER_TEMP/mysql-tls"
      - name: MySQL 8.4, presenting the run's certificate
        run: |
          docker run -d --name laravel-mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=ci-root \
            -v "$RUNNER_TEMP/mysql-tls:/etc/mysql-tls:ro" mysql:8.4 \
            --ssl-ca=/etc/mysql-tls/ca.pem --ssl-cert=/etc/mysql-tls/server.pem \
            --ssl-key=/etc/mysql-tls/server-key.pem
          # Over TCP, which the image's first, temporary server does not listen on, so this waits
          # for the server that stays. A container that has exited stops the wait at once, and
          # either way of not starting prints the server's own log and fails the step.
          for attempt in $(seq 1 90); do
            if mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pci-root -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL answered after $attempt attempt(s)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' laravel-mysql)" != "true" ]; then
              docker logs laravel-mysql
              echo "::error::the MySQL container exited before it answered"
              exit 1
            fi
            sleep 2
          done
          docker logs laravel-mysql
          echo "::error::MySQL did not answer within three minutes"
          exit 1
      - name: A schema of views, one not granted, one that sleeps, and a read-only user
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pci-root <<'SQL'
          CREATE DATABASE portal_data;
          CREATE TABLE portal_data.clients (
            id INT PRIMARY KEY, name VARCHAR(100), status VARCHAR(20), department VARCHAR(50),
            manager_id INT, contract_value DECIMAL(12, 2), updated_at TIMESTAMP NULL,
            password VARCHAR(100)
          );
          INSERT INTO portal_data.clients VALUES
            (3, 'Client three', 'active', 'maintenance', 7, 300.00, '2019-03-01 10:00:00', 'x'),
            (1, 'Client one', 'active', 'maintenance', 7, 100.10, '2019-03-01 10:00:00', 'x'),
            (2, 'Client two', 'active', 'maintenance', 7, 200.00, '2019-03-01 10:00:00', 'x');
          CREATE TABLE portal_data.users (
            id INT PRIMARY KEY, display_name VARCHAR(100), department VARCHAR(50),
            status VARCHAR(20), updated_at TIMESTAMP NULL
          );
          CREATE DATABASE portal;
          CREATE VIEW portal.v_client AS SELECT id, contract_value, department, manager_id, name,
            status, updated_at FROM portal_data.clients;
          CREATE VIEW portal.v_user AS SELECT id, department, display_name, status, updated_at
            FROM portal_data.users;
          CREATE DATABASE ungranted;
          CREATE VIEW ungranted.v_client AS SELECT * FROM portal.v_client;
          CREATE DATABASE slow;
          CREATE VIEW slow.v_client AS SELECT * FROM portal.v_client WHERE SLEEP(2) = 0;
          CREATE USER 'brain_reader'@'%' IDENTIFIED BY 'ci-reader';
          GRANT SELECT ON portal.v_client TO 'brain_reader'@'%';
          GRANT SELECT ON portal.v_user TO 'brain_reader'@'%';
          GRANT SELECT ON slow.v_client TO 'brain_reader'@'%';
          SQL
      - name: The executor's reads of the real server
        env:
          LARAVEL_TEST_MYSQL_CA: ${{ runner.temp }}/mysql-tls/ca.pem
        run: uv run pytest tests/unit/test_laravel_reader.py -m needs_mysql --junitxml=laravel-mysql.xml
      - name: Every real-server test ran and none was skipped
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ElementTree
          suite = ElementTree.parse("laravel-mysql.xml").getroot().find("testsuite")
          ran, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          assert ran >= 7 and skipped == 0, f"{ran} ran and {skipped} skipped: nothing was read"
          PY

  # The coverage floor, over every shard's data at once. It carries the name the single job had,
  # so a check required under that name still means what it meant.
  #
  # **The floor is held when every shard ran the whole suite, and only then.** A selected run
  # covers a fraction of the code, so judging it against a floor set for the whole suite would
  # fail every small change for the files it correctly did not run. A run that cannot be sure
  # (a workflow, fixture or lock change, say) runs everything, and this job then judges it as it
  # always did; every other night the nightly suite holds the same floor over the same data.
  # A selected run is what the `plan-shard-*` files say it was, never inferred from a missing file:
  # no plan files at all is a failure rather than a selected run.
  coverage:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: [tests, changes]
    # Runs when a shard failed as well, and fails itself. A job skipped because what it needs
    # failed reports as passing a required check, so a skipped floor would read as a green one.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.tests.result }}
          TASKS_ONLY: ${{ needs.changes.outputs.tasks_only }}
        run: |
          [ "$SHARDS" = "success" ] || [ "$TASKS_ONLY" = "true" ] || { echo "::error::the unit test shards ended in $SHARDS"; exit 1; }
          echo "every shard passed"
      - uses: actions/download-artifact@v4
        if: ${{ needs.changes.outputs.tasks_only != 'true' }}
        with:
          pattern: plan-shard-*
          path: ${{ runner.temp }}/plan-data
          merge-multiple: true
      - name: Did every shard run the whole suite
        id: mode
        if: ${{ needs.changes.outputs.tasks_only != 'true' }}
        run: |
          total=$(find "${{ runner.temp }}/plan-data" -name 'plan-shard-*.txt' 2>/dev/null | wc -l | tr -d '[:space:]')
          [ "$total" -gt 0 ] || { echo "::error::no shard left a plan, so nothing says what ran"; exit 1; }
          full=$({ grep -lx 'mode=full' "${{ runner.temp }}/plan-data"/plan-shard-*.txt || true; } | wc -l | tr -d '[:space:]')
          if [ "$full" = "$total" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "every one of $total shards ran the whole suite, so the coverage floor is held here"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "$((total - full)) of $total shards ran a selection of the suite, so the coverage floor is held by the nightly suite and not by this run"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.mode.outputs.full == 'true' }}
      - uses: astral-sh/setup-uv@v5
        if: ${{ steps.mode.outputs.full == 'true' }}
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: ${{ steps.mode.outputs.full == 'true' }}
        run: uv sync --locked
      - uses: actions/download-artifact@v4
        if: ${{ steps.mode.outputs.full == 'true' }}
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Coverage floor over the whole suite
        if: ${{ steps.mode.outputs.full == 'true' }}
        # `coverage report` reads `fail_under` from `pyproject.toml` and exits non-zero below
        # it. No `--fail-under` here: the floor has one home, and a second copy in a workflow is
        # the one nobody raises. Every shard that ran the whole suite left data, so a shard
        # missing from it is a floor over less than the suite.
        run: |
          plans=$(find "${{ runner.temp }}/plan-data" -name 'plan-shard-*.txt' | wc -l | tr -d '[:space:]')
          data=$(find coverage-data -name 'coverage-shard-*' | wc -l | tr -d '[:space:]')
          [ "$plans" = "$data" ] || { echo "::error::$plans shards ran and $data left coverage data"; exit 1; }
          uv run coverage combine coverage-data/coverage-shard-*
          uv run coverage report

  sweeps:
    name: Schema and registry sweeps
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default is a shallow clone of one commit, and every
          # check in this job that reads `Closes:` trailers then computes against an
          # almost empty set: the traceability sweep passed here while verifying
          # nothing about commit claims, and a test that reads real history failed
          # for a reason that did not exist on any laptop.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Row-level security on every entity table
        run: uv run python -m brain.ops.sweeps rls
      - name: No foreign key from a grant table to a connector table
        run: uv run python -m brain.ops.sweeps grant_isolation
      - name: Tool naming grammar
        run: uv run python -m brain.ops.sweeps tool_registry
      - name: One tool-name grammar, not four
        # There were three copies and they disagreed, so a name that passed validation and
        # passed CI was refused at registration. This catches the next copy at the moment
        # somebody writes it rather than the day the two halves are asked the same thing.
        run: uv run python -m brain.ops.sweeps one_tool_grammar
      - name: House style, no em dash in the source
        # CLAUDE.md has forbidden them since it was written and nothing enforced it, so
        # eighty-one accumulated. Scoped to the areas that are clean; `tests` and `docs` hold
        # the rest and a gate that is red on arrival is a gate somebody switches off.
        run: uv run python -m brain.ops.sweeps house_style
      - name: Client independence — no client value, and one reader
        # M41.1.8. On every commit rather than once before a second client, so the final
        # audit verifies a gate that has been green all along instead of cleaning a year of
        # drift. A blocklist of the first client's names would pass for the second client;
        # this refuses value shapes and second readers, which hold for a client nobody has met.
        run: uv run python -m brain.ops.sweeps client_independence
      - name: Traceability — nothing claimed without a test id
        run: uv run python -m brain.ops.sweeps traceability
      - name: Slug collisions — one name means one thing
        # Scopes and agents are rows that mostly do not exist yet, so this compares little
        # today and says so in its output rather than printing a bare "ok". A sweep that
        # reports success over an empty comparison is how `traceability` spent its whole
        # life green while checking nothing.
        run: uv run python -m brain.ops.sweeps slug_collisions
      - name: An install from empty builds the whole schema and reads nothing else
        # The half of M41.2.1 that needs no database: one revision chain reaching an empty
        # database, every schema and extension `brain.db` declares created by some migration,
        # and every table created with row-level security enabled in the same migration. The
        # other half runs in the `install` job below, against a database this built.
        run: uv run python -m brain.ops.sweeps install_from_empty
      - name: Every console write carries the writer's reach and the request's trace to the ledger
        # M24.3.1. A write to a table whose trigger reads the attribution, followed back to the
        # route that reaches it, has to pass through something setting it; otherwise its ledger
        # entry carries thirty-two zeros and a transaction number, and verifies anyway.
        run: uv run python -m brain.ops.sweeps write_attribution
      - name: Every capability the product checks can be granted from the console
        # M1.7.1. A route or screen checking a capability the furnished registry lacks is a
        # control nobody on any install can be given.
        run: uv run python -m brain.ops.sweeps capability_registry
      - name: Migration policy
        # Autogenerate is very often nearly right, and nearly right passes review. These
        # are the three ways it is wrong that a diff does not show: a rename written as a
        # drop plus an add, a not-null column with no default, and schema mixed with data.
        run: uv run python -m brain.ops.migration_policy
      - name: A migration leaves the release before it working
        # M30.2.6, and it is deliberately not a sweep. Every member of `brain.ops.sweeps` is
        # a property of the whole repository: row-level security on every table, one tool
        # grammar, no client value anywhere. This is a rule applied to one directory at the
        # moment a file is added to it, which is the shape `brain.ops.migration_policy`
        # already has and is why it runs beside it rather than inside the registry.
        #
        # It is here rather than in `tests`, where the migrations already run forward and
        # back, because that job proves a migration works against its own code and this asks
        # whether it works against the release the deploy has not yet replaced. That pair is
        # never in one room, on a runner or on a server, so nothing else can ask.
        #
        # Read the output rather than the tick. It ends in a count of statements the check
        # could not read and a list of what it does not cover; a green line here is a
        # narrower claim than it looks and the run says so itself.
        run: uv run python -m brain.deployment.compatibility

  # The console's guards ran nowhere but a laptop until 2026-09-07.
  #
  # Found by an agent building the matrix screen, and it is the largest hole this pipeline
  # has had: 266 tests, a strict type check, an import-boundary check and a production build,
  # none of them run by anything except the person who happened to remember. Every one of the
  # console's checks against the Python side is in that set, including the ones that read a
  # route's declared query parameters out of the generated document, which is exactly the
  # class of check that exists because the two halves drift silently.
  #
  # `api:generate` runs the Python exporter first, so this job needs both toolchains. That is
  # also the point of running it here rather than trusting a committed schema:
  # `src/api/generated/` is gitignored precisely so the console cannot compile against an API
  # that no longer exists, and a job that skipped regeneration would restore that hazard with
  # extra steps.
  # Runs on a push to main as well as on a pull request, when the push touches what the console is
  # built from (the filter in `brain.ops.ci_paths`). Each pull request passes it alone, but two
  # merged pull requests can break a test neither broke by itself: on 2026-10-19 a guard from one and a
  # label from another left main red in this job for hours, because main never ran it. The deploy
  # workflow starts only from a CI run that concluded success, so a red console job on main holds the
  # deploy without any `needs` between the two workflows.
  console:
    name: Console types, boundaries, tests, build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.tasks_only != 'true' && needs.changes.outputs.console == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        working-directory: console
        run: npm ci
      - name: Generate the typed client from the live application
        working-directory: console
        run: npm run api:generate
      - name: Types (strict)
        working-directory: console
        run: npm run typecheck
      - name: Import boundaries
        working-directory: console
        run: npm run check:boundaries
      - name: Generate the work breakdown's files
        # The console audit test reads the leaf ids from `docs/wbs.json`, which is generated and
        # not committed (brain.ops.wbs_generate).
        run: python3 src/brain/ops/wbs_generate.py
      - name: Tests
        working-directory: console
        run: npm run test -- --run
      - name: Build
        working-directory: console
        run: npm run build
      - name: The built console names no other host, and ships its fonts with their notice
        # M27.15.75. The sources are read by a unit test; this reads what the build emitted, which
        # is where a hosted font would appear: no address in the entry document or a stylesheet
        # leaves the install, every font a stylesheet names is in the bundle, and each family has
        # its licence notice. The same rule runs on the install over the image's own bundle.
        run: uv run python -m brain.ops.bundle_audit console/dist

  docs:
    name: Tracker matches the WBS
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the task-list tests read the claims from commit messages.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the work breakdown's files from its sources
        # `docs/wbs.json`, `docs/tracker.html` and `docs/wave-windows.json` are not committed:
        # every pull request that regenerated them conflicted with every other one, and a
        # conflicted pull request gets no CI. This job used to regenerate them and diff against
        # the committed copy; now it makes them and fails when the generator refuses the
        # sources (an id in progress.js that names no leaf, an act whose sentence changed, a
        # syntax error), which is the disagreement that diff was there to find. The script is
        # standard library only, so it runs before any environment is built.
        run: python3 src/brain/ops/wbs_generate.py
      - name: A pull request does not carry the generated files
        # A warning and not a failure, so a pull request branched before they stopped being
        # committed is not blocked: merge main, then `git rm --cached docs/wbs.json
        # docs/tracker.html docs/wave-windows.json`. Their being ignored is held by
        # tests/unit/test_wbs_generate.py.
        run: |
          tracked=$(git ls-files -- docs/wbs.json docs/tracker.html docs/wave-windows.json)
          if [ -n "$tracked" ]; then
            echo "::warning::these are generated and must not be committed, run git rm --cached on them: $tracked"
          fi
      - uses: astral-sh/setup-uv@v5
        if: ${{ needs.changes.outputs.tasks_only == 'true' }}
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: ${{ needs.changes.outputs.tasks_only == 'true' }}
        run: uv sync --locked
      - name: Every requirement names a task and a proof task
        if: ${{ needs.changes.outputs.tasks_only == 'true' }}
        run: uv run python -m brain.requirements
      - name: The tests that read the task list
        if: ${{ needs.changes.outputs.tasks_only == 'true' }}
        run: >-
          uv run pytest -q
          tests/unit/test_status.py tests/unit/test_screens.py tests/unit/test_reliability.py
          tests/unit/test_catalogue.py tests/unit/test_migration_checklist.py tests/unit/test_backup_ladder.py
          tests/unit/test_requirements_register.py tests/unit/test_wave_report.py tests/unit/test_launch.py
          tests/unit/test_assembly.py tests/unit/test_architecture_doc.py

  # M41.2.5. An install into a scratch container, from a database with nothing in it, ending
  # in a question that gets answered.
  #
  # **Deliberately not a step in the `tests` job, which also has a database.** That one runs
  # the unit suite first, and the suite creates whatever it needs; by the time a migration ran
  # there the database would not be empty, and "install from empty" would be a claim about a
  # database somebody else had already touched. This job runs nothing before the migrations,
  # its own service container is created for it and destroyed after it, and the first step
  # asserts the database really is empty rather than assuming a fresh container is.
  #
  # Every value the last steps compare against is derived from `brain.demo` rather than typed
  # here: a literal in a workflow is a second copy of the demo that nothing keeps in step, and
  # it drifts by going on asserting a value the demo no longer holds.
  install:
    name: Install from empty and answer one question
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          # A credential for a container created and destroyed inside this job, unreachable
          # from outside the runner. `brain.firstrun.credential_default_gaps` reads the
          # deployment configuration and deliberately not this file, for that reason.
          POSTGRES_PASSWORD: install-from-empty
          POSTGRES_DB: brain_install
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:install-from-empty@localhost:5432/brain_install
      APP_ROLE_PASSWORD: "install'from\"empty"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked

      - name: The database really is empty before anything runs
        # Asserted rather than assumed. A job that installs into a database somebody already
        # migrated proves nothing at all, and the failure is silent: everything downstream
        # passes because the schema was already there.
        run: |
          n=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_namespace where nspname not like 'pg_%' and nspname not in ('information_schema','public')" | tr -d '[:space:]')
          [ "$n" = "0" ] || { echo "::error::the scratch database already has $n schema(s)"; exit 1; }
          echo "empty: no application schema present"

      - name: Migrations build the whole schema from nothing
        run: uv run alembic upgrade head

      - name: Every schema the code expects is there
        run: uv run python -m brain.ops.schema_check

      - name: Row-level security, on a database this job built from empty
        # The produced half of M41.2.1. `brain.ops.sweeps install_from_empty` reads what the
        # migrations declare and runs in the sweeps job with no database; this asks the
        # database that those declarations built. A table can be declared with a policy and
        # still arrive without one if the statement never ran, and only this notices.
        run: |
          uv run python -m brain.ops.sweeps rls
          uv run python -m brain.ops.sweeps grant_isolation

      - name: The demo company loads into the tables the migrations made
        run: uv run python -m brain.seed

      - name: One question, asked and answered end to end
        # The whole point of the job. A migrated, seeded install that has never been asked
        # anything has not been shown to work, and every install bug this repository has had
        # lived in exactly that gap.
        run: uv run python -m brain.seed --smoke

      - name: A question about a record that does not exist answers the same nothing
        # The disclosure rule, on the first screen a new install has. An answer that
        # distinguished "no such client" from "I do not understand" would teach its first user
        # which clients exist.
        run: |
          absent=$(uv run python -m brain.seed --ask "what is the status of Nobody At All")
          unknown=$(uv run python -m brain.seed --ask "what colour is the sky")
          [ "$absent" = "$unknown" ] || { echo "::error::an absent record and an unmatched question answer differently"; exit 1; }
          echo "both answered: $absent"

      - name: Loading the demo a second time changes nothing and is not refused
        # `ON CONFLICT DO NOTHING`, against a real database rather than against a string.
        # No `--force`: the second load has to be permitted by `not_yet_loaded`, so this step
        # proves the guard lets the demo past itself rather than bypassing the guard.
        run: |
          before=$(psql "$DATABASE_URL" -tAc "select count(*) from auth.principal" | tr -d '[:space:]')
          uv run python -m brain.seed
          after=$(psql "$DATABASE_URL" -tAc "select count(*) from auth.principal" | tr -d '[:space:]')
          [ "$before" = "$after" ] || { echo "::error::a repeated load changed the row count from $before to $after"; exit 1; }
          echo "repeat load is a no-op at $after principal(s)"

      - name: The demo can be removed, and leaves nothing behind
        # M41.2.6's smallest testable half. The removal is bounded by the identifiers
        # `brain.demo` declares, so what it must leave behind is everything else.
        run: |
          uv run python -m brain.seed --remove
          left=$(psql "$DATABASE_URL" -tAc "select count(*) from auth.principal" | tr -d '[:space:]')
          [ "$left" = "0" ] || { echo "::error::$left demo principal(s) survived the removal"; exit 1; }
          # The same question the install answered, now expected to answer nothing. `if`
          # rather than `&&` because the default shell is `bash -e` and a failing command in
          # a condition is the one place that does not end the script.
          if uv run python -m brain.seed --smoke; then
            echo "::error::the demo still answers after being removed"
            exit 1
          fi
          echo "after removal the demo answers nothing"

      - name: The reset command refuses an install, then drops and rebuilds a development one
        # M0.4.5, run rather than described. The refusals come first and are proved harmless by
        # the schema still being at head after them; then the reset runs over the database this
        # job just used, and the demo it reloads answers again. `if` for the refusals, because
        # the default shell is `bash -e`.
        run: |
          if BRAIN_ENV=production uv run python -m brain.tasks reset; then
            echo "::error::reset ran against an install declaring production"; exit 1
          fi
          if env -u BRAIN_ENV uv run python -m brain.tasks reset; then
            echo "::error::reset ran in a shell that declared no environment"; exit 1
          fi
          uv run alembic current | grep -q "(head)" || { echo "::error::a refused reset changed the schema"; exit 1; }
          BRAIN_ENV=development uv run python -m brain.tasks reset
          uv run alembic current | grep -q "(head)" || { echo "::error::reset did not rebuild to head"; exit 1; }
          uv run python -m brain.seed --smoke
          echo "reset refused twice, then dropped, rebuilt and reseeded"

  stack:
    name: The whole stack starts
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.tasks_only != 'true' }}
    # Job level, not step level. Set per-step, the later `docker compose exec` calls run
    # without POSTGRES_PASSWORD and compose resolves it to an empty string - which looks
    # like the migrations never ran rather than like a missing variable.
    #
    # M0.4.1: the stack started is `docker-compose.lite.yml`, by name, because that is the file
    # `ops/install/install.sh` deploys for the lite profile. `docker-compose.yml` is what Coolify
    # deploys, and `test_repo_shape.py` holds the two equal as parsed YAML.
    env:
      COMPOSE_FILE: docker-compose.lite.yml
      APP_IMAGE: brain:ci
      POSTGRES_PASSWORD: ci-test-password
      BRAIN_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - name: Generate the work breakdown's files the image carries
        # The tracker and the plan are generated and not committed (brain.ops.wbs_generate);
        # the deploy workflow makes them before its build for the same reason, and the
        # `/build/tracker` check below asks the built image for the page.
        run: python3 src/brain/ops/wbs_generate.py
      - name: Build the image the way production builds it
        run: docker build --build-arg COMMIT_SHA=ci-test -t brain:ci .
      - name: Bring the full stack up
        # Two bugs reached the server that every other job here passed: a Postgres 18
        # volume path that only fails when the container starts, and a Dockerfile that
        # never copied the migrations. Both are invisible to lint, types, tests and
        # sweeps, because the compose file is valid YAML pointing at a real image.
        # Only starting it finds them.
        run: |
          docker compose up -d --wait --wait-timeout 180 || {
            echo "::error::stack did not come up"
            docker compose ps
            docker compose logs --tail 60
            exit 1
          }
      - name: Readiness, not liveness
        run: |
          for i in $(seq 1 30); do
            code=$(docker compose exec -T app python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status)" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::/health/ready returned $code"; docker compose logs --tail 60 app; exit 1; }
      - name: Migrations actually applied
        # The app reports ready only when migrations succeeded, so this asserts the
        # schema exists rather than trusting the health check alone.
        run: |
          echo "--- schemas present ---"
          docker compose exec -T db psql -U brain -d brain -tAc             "select nspname from pg_namespace where nspname not like 'pg_%' and nspname <> 'information_schema' order by 1"
          echo "--- alembic version ---"
          docker compose exec -T db psql -U brain -d brain -tAc             "select version_num from alembic_version" || echo "(no alembic_version table)"
          echo "--- app startup log ---"
          docker compose logs app --tail 25
          # Run inside the container, which is the honest place to ask: it checks the schema
          # list the *running image* expects against the database that image migrated,
          # rather than the list this checkout happens to have. See the tests job for why
          # this is a module and not a shell one-liner.
          docker compose exec -T app python -m brain.ops.schema_check
      - name: Row-level security, against a database that exists
        # THE SWEEP THAT HAD NEVER RUN. `brain.ops.sweeps rls` skips when DATABASE_URL is
        # unset, and the standalone sweeps job has no database service, so for the whole life
        # of this pipeline it printed "skip: DATABASE_URL unset (CI always sets it)" and
        # exited 0. The parenthetical was false in the one place it was read.
        #
        # A skip is right on a laptop, where there is genuinely no database and failing would
        # make the sweep something people stop running. It is wrong here. So the check lives
        # in this job, which has a migrated database, and runs inside the container, which is
        # the honest place to ask: it reads the schema the running image actually built.
        #
        # This is the class of bug the sweep exists to catch. A table shipped with RLS off is
        # one forgotten WHERE clause from returning every row to every caller, and it looks
        # correct in every test that happens to use a wide principal.
        run: |
          docker compose exec -T app python -m brain.ops.sweeps rls
          docker compose exec -T app python -m brain.ops.sweeps grant_isolation

      - name: The documents are served
        run: |
          for path in / /build /build/tracker /admin /api/status.json; do
            code=$(docker compose exec -T app python -c "import urllib.request,sys;print(urllib.request.urlopen('http://127.0.0.1:8000$path',timeout=8).status)" 2>/dev/null || echo 000)
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
      - name: Tear down
        if: always()
        run: docker compose down -v

  # M0.4.2. The personal data analyser is the one service the full profile gained on
  # 2026-09-21, and its image, port, readiness probe and memory limit were chosen from
  # Microsoft's published figures rather than measured here. This starts that exact service
  # from its own file and measures them: the probe goes healthy, a name is found (so the spaCy
  # model is loaded and serving), what it holds is below its limit, and its network has no
  # route out. The whole full profile is not started, and cannot be anywhere yet: two of its
  # images (`INFERENCE_IMAGE`, `MATCHER_IMAGE`) are not published, and it reserves more memory
  # than a hosted runner has. `docker compose config` on the one file is the check that the
  # merge is a valid project; `tests/unit/test_compose.py` holds it equal to its sources.
  presidio:
    name: The personal data analyser starts, answers and fits its limit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tasks_only != 'true' && needs.changes.outputs.presidio == 'true' }}
    env:
      COMPOSE_FILE: docker-compose.presidio.yml
    steps:
      - uses: actions/checkout@v4
      - name: The one-file full profile is a valid compose project
        env:
          APP_IMAGE: ci
          INFERENCE_IMAGE: ci
          MATCHER_IMAGE: ci
          INSTALL_OIDC_REDIRECT_URIS: ci
          KEYCLOAK_ADMIN: ci
          KEYCLOAK_ADMIN_PASSWORD: ci
          KEYCLOAK_DB_PASSWORD: ci
          KEYCLOAK_HOSTNAME: ci
        run: docker compose -f docker-compose.full.yml config --quiet
      - name: Start the analyser and wait for its own healthcheck
        run: |
          docker compose up -d --wait --wait-timeout 300 || {
            echo "::error::presidio-analyzer did not become healthy"
            docker compose ps; docker compose logs --tail 80; exit 1
          }
      - name: A name is found, so the model is serving and not only the web server
        run: |
          out=$(docker compose exec -T presidio-analyzer curl -fsS -m 20 \
            -H 'Content-Type: application/json' \
            -d '{"text":"Please call David Johnson tomorrow.","language":"en","entities":["PERSON"]}' \
            http://127.0.0.1:3000/analyze)
          echo "$out"
          echo "$out" | grep -q PERSON || { echo "::error::no PERSON found"; exit 1; }
      - name: What it holds is below its limit
        run: |
          id=$(docker compose ps -q presidio-analyzer)
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.MemPerc}}' "$id"
          used=$(docker stats --no-stream --format '{{.MemPerc}}' "$id" | tr -d '%')
          limit=$(docker inspect -f '{{.HostConfig.Memory}}' "$id")
          echo "limit bytes: $limit, used: $used%"
          [ "$limit" = "$((1536 * 1024 * 1024))" ] || { echo "::error::limit is $limit"; exit 1; }
          awk -v u="$used" 'BEGIN { exit !(u < 90) }' || { echo "::error::holding $used% of its limit"; exit 1; }
      - name: Its network has no route out
        run: |
          if docker compose exec -T presidio-analyzer curl -fsS -m 8 -o /dev/null https://pypi.org; then
            echo "::error::the analyser reached the internet"; exit 1
          fi
          echo "no route out, as the internal network declares"
      - name: Tear down
        if: always()
        run: docker compose down -v

  # M41.2.6 and M41.4.1 on a real install rather than over fakes. `brain.ops.handover_run` is
  # tested against a dictionary pretending to be a database and another pretending to be an
  # object store, and neither can refuse a COPY, sign a request wrongly or keep a schema a drop
  # missed. So this builds an install from empty with its own object store and vault, loads the
  # demo, puts objects under this install's prefix and a neighbour's, and runs the procedure in
  # docs/install/handover.md step by step: export, the company's own check with `sha256sum -c`,
  # plan, remove with the id typed back, the operator's steps recorded with what was really done,
  # certify, and then looks for itself at what is left.
  #
  # **The prefix is saved in the console's table and deliberately not in the environment.**
  # That is how the wizard leaves an install, and the command read only the environment until
  # this job ran it: the export found nothing of this install's and the teardown worked under
  # the default prefix, which is where the neighbour's object is put below.
  handover:
    name: A handover exports every store, removes the install and certifies it
    runs-on: ubuntu-latest
    # A drop waiting on a lock hung the first run for an hour; see the remove step.
    timeout-minutes: 30
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tasks_only != 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          # A credential for a container created and destroyed inside this job, as in `install`.
          POSTGRES_PASSWORD: handover-scratch
          POSTGRES_DB: brain_handover
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:handover-scratch@localhost:5432/brain_handover
      APP_ROLE_PASSWORD: handover-scratch-app
      # The vault and the store below are this job's own containers; the token is the dev
      # server's root token and the key pair exists only in them.
      BRAIN_VAULT_ADDRESS: http://localhost:8200
      BRAIN_VAULT_TOKEN: handover-scratch-root
      STORE_ACCESS_KEY: handover-scratch-access
      STORE_SECRET_KEY: handover-scratch-secret
      INSTALL_OBJECT_STORE_BACKEND: seaweedfs
      INSTALL_OBJECT_STORE_URL: http://localhost:8333
      SAVED_PREFIX: scratch-install
      HANDOVER_ID: scratch-handover-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: The handover directory and the schemas it must account for
        run: |
          echo "HANDOVER=$RUNNER_TEMP/handover" >> "$GITHUB_ENV"
          echo "SCHEMAS=$(uv run python -c 'from brain.db import SCHEMAS; print(" ".join(SCHEMAS))')" >> "$GITHUB_ENV"

      - name: The object store and the vault this install keeps its files and keys in
        # The store's buckets are made by the product's own ops/seaweedfs/provision.sh, and its
        # key goes into the vault slot `brain.ops.storage.credential_path` names, so the command
        # connects the way an install does rather than being handed a client.
        run: |
          docker network create handover
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          printf '{"identities":[{"name":"brain-application","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List"]}]}' \
            "$STORE_ACCESS_KEY" "$STORE_SECRET_KEY" > "$RUNNER_TEMP/seaweedfs/s3.json"
          docker run -d --name seaweedfs --network handover -p 8333:8333 \
            -v "$RUNNER_TEMP/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:3.80 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          docker run -d --name openbao --cap-add IPC_LOCK -p 8200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID="$BRAIN_VAULT_TOKEN" openbao/openbao:2.4.1 \
            server -dev -dev-root-token-id="$BRAIN_VAULT_TOKEN" -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 60); do
            curl -sf http://localhost:8333/status >/dev/null && curl -sf http://localhost:8200/v1/sys/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8333/status >/dev/null || { echo "::error::the object store did not answer"; docker logs --tail 40 seaweedfs; exit 1; }
          curl -sf http://localhost:8200/v1/sys/health >/dev/null || { echo "::error::the vault did not answer"; docker logs --tail 40 openbao; exit 1; }
          docker run --rm --network handover -e WEED_MASTER=seaweedfs:9333 \
            -v "$PWD/ops/seaweedfs/provision.sh:/opt/provision.sh:ro" --entrypoint /bin/sh \
            chrislusf/seaweedfs:3.80 /opt/provision.sh
          curl -sf -H "X-Vault-Token: $BRAIN_VAULT_TOKEN" -X POST \
            -d '{"type":"kv","options":{"version":"2"}}' http://localhost:8200/v1/sys/mounts/providers
          curl -sf -H "X-Vault-Token: $BRAIN_VAULT_TOKEN" -X POST \
            -d "{\"data\":{\"access_key_id\":\"$STORE_ACCESS_KEY\",\"secret_access_key\":\"$STORE_SECRET_KEY\"}}" \
            http://localhost:8200/v1/providers/data/seaweedfs >/dev/null

      - name: An install from empty, with the demo company loaded and asked one question
        run: |
          uv run alembic upgrade head
          uv run python -m brain.seed
          uv run python -m brain.seed --smoke

      - name: The object store prefix is saved in the console's table, and files are put
        # This install's objects under the saved prefix and at the backup bucket's root, which is
        # where the backup job writes; a neighbour's under the default prefix, which must survive.
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine

          from brain.db import normalise_database_url
          from brain.ops.install_settings import save
          from brain.ops.object_store import object_store_at_start


          async def keep_prefix() -> None:
              engine = create_async_engine(normalise_database_url(os.environ["DATABASE_URL"]))
              async with async_sessionmaker(engine)() as session, session.begin():
                  await save(
                      session,
                      {"INSTALL_OBJECT_STORE_PREFIX": os.environ["SAVED_PREFIX"]},
                      updated_by="ci",
                  )
              await engine.dispose()


          asyncio.run(keep_prefix())
          store = object_store_at_start(os.environ["BRAIN_VAULT_ADDRESS"], os.environ["BRAIN_VAULT_TOKEN"])
          assert store.backend is not None, store.unconnected
          ours = os.environ["SAVED_PREFIX"]
          store.backend.put_object("assets", f"{ours}/demo/logo.txt", b"this install's logo", "text/plain")
          store.backend.put_object("recordings", f"{ours}/run-1/capture.txt", b"a recording", "text/plain")
          store.backend.put_object("backups", "demo.manifest.json", b"{}", "application/json")
          store.backend.put_object("assets", "brain/logo.txt", b"a neighbour's logo", "text/plain")
          PY

      - name: Export every store and the audit ledger
        run: |
          uv run python -m brain.ops.handover_run export "$HANDOVER" \
            --handover-id "$HANDOVER_ID" --reason contract_ended \
            --instructed-by "the scratch install's owner" --instruction-reference "ci.yml, handover job"

      - name: The company checks the export with sha256sum and nothing of ours
        run: |
          cd "$HANDOVER"
          sha256sum --strict -c SHA256SUMS
          # Every table of every schema is a file, counted against the database itself.
          for s in $SCHEMAS; do
            tables=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = '$s' and c.relkind in ('r','p') and not c.relispartition")
            files=$(jq --arg s "data/db/$s/" '[.files[] | select(.path | startswith($s))] | length' manifest.json)
            [ "$tables" = "$files" ] || { echo "::error::schema $s has $tables table(s) and the export $files file(s)"; exit 1; }
          done
          ledger=$(jq '[.files[] | select(.source == "obs.audit_entry")][0].rows' manifest.json)
          live=$(psql "$DATABASE_URL" -tAc "select count(*) from obs.audit_entry")
          [ "$ledger" = "$live" ] && [ "$live" -gt 0 ] || { echo "::error::the audit ledger holds $live row(s) and the export $ledger"; exit 1; }
          [ "$(cat "data/objects/assets/$SAVED_PREFIX/demo/logo.txt")" = "this install's logo" ] || { echo "::error::this install's object was not exported"; exit 1; }
          [ -f data/objects/backups/demo.manifest.json ] || { echo "::error::the backup bucket was not exported"; exit 1; }
          [ ! -e data/objects/assets/brain ] || { echo "::error::a neighbour's object was exported"; exit 1; }
          jq -e '[.stores[] | select(.reached | not)] | length == 0' manifest.json >/dev/null || { echo "::error::a store was not reached"; exit 1; }
          echo "intact: $(wc -l < SHA256SUMS) file(s), $ledger ledger entries"

      - name: Plan the teardown from the verified export
        run: |
          uv run python -m brain.ops.handover_run verify "$HANDOVER"
          uv run python -m brain.ops.handover_run plan "$HANDOVER"

      - name: Remove, typing the handover id back
        # The procedure stops the application first; this job runs none, so it asserts nothing
        # else is connected instead. The first run hung here for an hour because the command's
        # own read of the saved settings held a lock its drop waited on; each drop now times out
        # and names the holders, and the step has a ceiling of its own. A wrong id first, proved
        # harmless by every schema still being there after it. `if`, because the default shell
        # is `bash -e`.
        timeout-minutes: 5
        run: |
          others=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_stat_activity where datname = current_database() and pid <> pg_backend_pid() and backend_type = 'client backend'")
          [ "$others" = "0" ] || { echo "::error::$others other session(s) hold the database before remove"; exit 1; }
          if uv run python -m brain.ops.handover_run remove "$HANDOVER" --confirm not-this-one; then
            echo "::error::remove ran with the wrong handover id"; exit 1
          fi
          kept=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_namespace where nspname = any(string_to_array('$SCHEMAS', ' '))")
          [ "$kept" = "$(echo $SCHEMAS | wc -w)" ] || { echo "::error::a refused remove dropped a schema"; exit 1; }
          uv run python -m brain.ops.handover_run remove "$HANDOVER" --confirm "$HANDOVER_ID"

      - name: The operator's steps, each done or recorded as absent from this install
        # Done for real where this job has the part: the vault slot, and the roles and version
        # table on a database server that outlives the install. The rest were never created
        # here, and the note says so on the certificate rather than claiming a removal. A part
        # added to the teardown fails this step until somebody says what it means here.
        run: |
          curl -sf -H "X-Vault-Token: $BRAIN_VAULT_TOKEN" -X DELETE http://localhost:8200/v1/providers/metadata/seaweedfs
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $BRAIN_VAULT_TOKEN" http://localhost:8200/v1/providers/data/seaweedfs)
          [ "$code" = "404" ] || { echo "::error::the store key is still in the vault ($code)"; exit 1; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP OWNED BY brain_app, brain_fastlane" -c "DROP ROLE brain_app, brain_fastlane" -c "DROP TABLE public.alembic_version"
          [ "$(jq -r '.connectors | length' "$HANDOVER/manifest.json")" = "0" ] || { echo "::error::a connector is live and this job cannot revoke its grant"; exit 1; }
          for part in $(jq -r '.steps[] | select(.by == "operator" and (.done | not)) | .what' "$HANDOVER/teardown.json"); do
            case "$part" in
              vault_secrets) note="done in CI: the store key's metadata deleted and the slot read back 404; the dev token dies with the job" ;;
              runtime) note="done in CI: roles and alembic_version dropped on the surviving database; the job's containers end with the runner" ;;
              cache) note="absent: this scratch install ran no valkey" ;;
              identity_realm) note="absent: this scratch install ran no Keycloak" ;;
              network_route) note="absent: this scratch install had no proxy route or DNS record" ;;
              install_configuration) note="absent: this scratch install had no install directory or .env file" ;;
              connector_authorisations) note="absent: the export lists no live connector" ;;
              chat_app) note="absent: this scratch install made no chat app" ;;
              *) echo "::error::the teardown has an operator part this job does not know: $part"; exit 1 ;;
            esac
            uv run python -m brain.ops.handover_run record "$HANDOVER" "$part" --note "$note"
          done

      - name: Certify
        run: |
          uv run python -m brain.ops.handover_run certify "$HANDOVER" | tee "$RUNNER_TEMP/certificate.out"
          grep -q "The last backup that can contain this data expires on" "$RUNNER_TEMP/certificate.out"
          jq -e --slurpfile t "$HANDOVER/teardown.json" '(.removed | length) == ($t[0].steps | length)' "$HANDOVER/certificate.json" >/dev/null
          jq -e '[.removed[] | select(.what == "chat_app")][0].note | startswith("absent")' "$HANDOVER/certificate.json" >/dev/null

      - name: The schemas and this install's objects are really gone, and the neighbour's are not
        # Looked at directly rather than taken from the command's own second look: the database
        # through psql, the store through a client built from the key this job holds, since the
        # vault slot the command used is gone.
        run: |
          left=$(psql "$DATABASE_URL" -tAc "select coalesce(string_agg(nspname, ','), '') from pg_namespace where nspname = any(string_to_array('$SCHEMAS', ' '))")
          [ -z "$left" ] || { echo "::error::schema(s) survived the handover: $left"; exit 1; }
          roles=$(psql "$DATABASE_URL" -tAc "select count(*) from pg_roles where rolname in ('brain_app', 'brain_fastlane')")
          [ "$roles" = "0" ] || { echo "::error::$roles install role(s) survived"; exit 1; }
          [ -z "$(psql "$DATABASE_URL" -tAc "select to_regclass('public.alembic_version')")" ] || { echo "::error::the version table survived"; exit 1; }
          uv run python - <<'PY'
          import os

          from brain.ops.object_store import S3Backend, StoreCredential, key_prefix
          from brain.ops.storage import BUCKETS, Backend, config_for

          store = S3Backend(
              config_for(Backend.SEAWEEDFS, endpoint_url=os.environ["INSTALL_OBJECT_STORE_URL"]),
              StoreCredential(
                  access_key_id=os.environ["STORE_ACCESS_KEY"],
                  secret_access_key=os.environ["STORE_SECRET_KEY"],
              ),
          )
          ours = os.environ["SAVED_PREFIX"]
          for bucket in BUCKETS:
              left = list(store.list_objects(bucket.name, key_prefix(bucket.name, ours)))
              assert not left, f"{len(left)} object(s) of this install survived in {bucket.name}"
          assert store.get_object("assets", "brain/logo.txt") == b"a neighbour's logo"
          print("gone: every schema, both roles, the version table and this install's objects")
          PY

      - name: Keep the handover's manifest and certificate, named for the commit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: handover-${{ github.sha }}
          path: |
            ${{ runner.temp }}/handover/manifest.json
            ${{ runner.temp }}/handover/teardown.json
            ${{ runner.temp }}/handover/certificate.json
            ${{ runner.temp }}/handover/certificate.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker rm -f seaweedfs openbao || true

  supply_chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tasks_only != 'true' && needs.changes.outputs.dependencies == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Licence allowlist, release age, archived check
        # Three components we planned around turned out to be archived while still being
        # widely recommended. This job exists so that is caught by CI and not by a person
        # reading a LICENCE file and forgetting to check whether the project is alive.
        run: uv run python -m brain.ops.sweeps dependencies
      - name: Every image's terms and the licences the npm locks record
        run: uv run python -m brain.ops.dependency_policy offline
      - name: The notices file names everything the release ships
        # M42.7.3. NOTICES.md is what the image and the archive carry; this fails when a lock or a
        # compose file moved and the file did not. Offline: the licences were read when it was
        # written (`python -m brain.ops.third_party_notices write > NOTICES.md`).
        run: uv run python -m brain.ops.third_party_notices check
      - name: The policy refuses a copyleft addition and an archived one, and passes the tree
        # M0.5.7 and M0.7.1. The release age, the archived check and each locked package's
        # licence as the index gives it are asked here and nowhere else, over both uv locks,
        # both npm locks and every image. `prove` adds a real GPL package and a real package
        # on an archived repository to a copy of the lock and requires both refused by the same
        # rules, and the evidence file is kept, named for the commit.
        env:
          # Read by `gh`, which the archived check calls, and never by the Python process.
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m brain.ops.dependency_policy prove
          --commit "${{ github.sha }}" --evidence evidence/dependency-policy.json
      - name: Keep the dependency policy evidence, named for the commit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-policy-${{ github.sha }}
          path: evidence/dependency-policy.json
          if-no-files-found: error
          retention-days: 90

  # M38.5.2. Known vulnerabilities in every locked dependency and in the image, on every build.
  #
  # Trivy scans and `brain.ops.vulnerabilities` decides: a critical finding fails the job unless
  # `ops/security/vulnerability-exceptions.json` records why it may ship and until when, and a
  # lock the scan did not read is a failure rather than a clean result. The image is built here
  # the way production builds it, since the image that ships is built after CI by `Deploy`.
  vulnerabilities:
    name: Vulnerability scan, locks and image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tasks_only != 'true' && needs.changes.outputs.image == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install Trivy from its signed package repository
        run: |
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -q && sudo apt-get install -y -q trivy
          trivy --version
      - name: Scan every lock
        # `.venv` is skipped because it is this runner's install of one lock, and the lock itself
        # is what is scanned; scanning both reports every finding twice under two targets.
        run: |
          mkdir -p evidence
          trivy fs --scanners vuln --list-all-pkgs --format json --skip-dirs .venv             --output evidence/trivy-locks.json .
      - name: Build the image the way production builds it
        run: docker build --build-arg COMMIT_SHA=ci-scan -t brain:scan .
      - name: Scan the image
        run: >-
          trivy image --scanners vuln --list-all-pkgs --format json
          --output evidence/trivy-image.json brain:scan
      - name: No critical finding without a recorded exception
        run: >-
          uv run python -m brain.ops.vulnerabilities
          --locks evidence/trivy-locks.json --image evidence/trivy-image.json
      - name: Keep both scans, named for the commit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vulnerabilities-${{ github.sha }}
          path: evidence/trivy-*.json
          if-no-files-found: error
          retention-days: 90

  # M0.5.3. The migration round trip over a database shaped like an install rather than over
  # whatever a test shard left. See `brain.ops.migration_shape`, which counts every table at head,
  # one step back and head again, refuses a step back that lost a row it kept, and prints how many
  # tables held a row when the rollback ran.
  migrations_install_shaped:
    name: Migrations round trip over an install-shaped database
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.tasks_only != 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: install-shaped
          POSTGRES_DB: brain_shaped
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:install-shaped@localhost:5432/brain_shaped
      APP_ROLE_PASSWORD: "install'shaped\"password"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: An install from empty, with the demo company loaded
        run: |
          uv run alembic upgrade head
          uv run python -m brain.seed
      - name: One step back and forward again keeps every row it keeps
        run: |
          mkdir -p evidence
          uv run python -m brain.ops.migration_shape record evidence/shape-head.json
          uv run alembic downgrade -1
          uv run python -m brain.ops.migration_shape record evidence/shape-back.json
          uv run alembic upgrade head
          uv run python -m brain.ops.migration_shape record evidence/shape-again.json
          uv run python -m brain.ops.migration_shape compare \
            evidence/shape-head.json evidence/shape-back.json evidence/shape-again.json
      - name: The whole chain back to base and forward again over that data
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current | grep -q "(head)" || { echo "::error::not at head"; exit 1; }
      - name: Keep the counts, named for the commit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-shape-${{ github.sha }}
          path: evidence/shape-*.json
          if-no-files-found: warn
          retention-days: 90

  # M38.1.1.1. A pull request's branch is named for its module, `M12/tool-registry`, so twelve
  # concurrent tracks cannot be reviewed as though they were the same work. The rule is
  # `brain.ops.conventions.check_branch_name`; until this job it had a test and no caller.
  branch_name:
    name: Branch named for its module
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: The branch name follows the convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: uv run python -m brain.ops.conventions --branch "$HEAD_REF"

  # M31.2.2.3. A deploy is not an instant: the migrations run, and until the old container stops
  # the new schema serves the previous release's code. `brain.deployment.compatibility` reads the
  # migration text and cannot run anything; this job runs the previous release against the new
  # schema. Every push to main deploys, so the previous release is what main was before this
  # change: the pull request's base, or the push's `before`.
  previous_release:
    name: The previous release runs on the new schema
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.tasks_only != 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: previous-release
          POSTGRES_DB: brain_previous
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:previous-release@localhost:5432/brain_previous
      APP_ROLE_PASSWORD: previous-release-app
      PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Which release came before, and whether this change migrates anything
        # No migration means the schema is the previous release's own, so there is nothing to
        # test. An unknown previous commit is not a pass: it fails, and says why.
        id: previous
        run: |
          git cat-file -e "$PREVIOUS_SHA^{commit}" || { echo "::error::previous release $PREVIOUS_SHA is not in this checkout"; exit 1; }
          if git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- migrations/; then
            echo "migrates=false" >> "$GITHUB_OUTPUT"; echo "no migration since $PREVIOUS_SHA"
          else
            echo "migrates=true" >> "$GITHUB_OUTPUT"
            git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_SHA"
          fi
      - name: The previous release builds its schema
        if: ${{ steps.previous.outputs.migrates == 'true' }}
        working-directory: ${{ runner.temp }}/previous
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: This release migrates it, as a deploy does
        if: ${{ steps.previous.outputs.migrates == 'true' }}
        run: |
          uv sync --locked
          uv run alembic upgrade head
      - name: The previous release writes to the new schema and answers from it
        # The window itself: the old code loading the demo company exercises its inserts, and
        # the smoke question exercises its reads, against tables this release has just changed.
        if: ${{ steps.previous.outputs.migrates == 'true' }}
        working-directory: ${{ runner.temp }}/previous
        run: |
          uv run python -m brain.seed
          uv run python -m brain.seed --smoke

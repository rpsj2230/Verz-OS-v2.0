# Records the audit ledger's head in a separate repository, on a schedule.
#
# The audit chain proves nobody edited an old entry. It proves nothing about deletion from
# the end: remove the newest twenty entries and what remains verifies perfectly, because a
# chain has no idea how long it was meant to be. Writing the head somewhere else turns that
# into a detectable fact.
#
# **This pulls; the server never pushes.** GitHub Actions reads the digest from the running
# application and commits it to the anchor repository. The alternative, having the server write
# its own anchor, needs a write credential on the one machine the anchor is supposed to be
# independent of, and then anyone who could delete audit entries could also write an anchor
# agreeing with the deletion. Nothing new lands on the server for this to work.
#
# **Where the anchors go is the install's, and is read from two settings of this repository:**
# the variable `ANCHOR_REPOSITORY` (`owner/name` of a private repository holding nothing else)
# and the secret `ANCHOR_DEPLOY_KEY`, an SSH deploy key with write access to that repository
# only. Neither is written here, for the reason `BRAIN_URL` is not: a repository name in this
# file is one company's value inside the product. The server holds neither.
#
# **The anchor repository's history is not protected by GitHub**: a private repository on a free
# plan cannot have branch protection, so a force-push over it is refused by nothing. What this
# workflow relies on instead is its own check, every run, that the last head it published is
# still in the ledger with the same digest. Rewriting the anchor history to agree with a
# truncated ledger needs the deploy key, which lives only in this repository's secrets.
#
# Task ids: M24.1.2, M24.3.3

name: Anchor

on:
  schedule:
    # Every six hours. Frequent enough that at most six hours of entries can vanish without
    # contradicting an anchor; rare enough that the log stays readable by a person.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  # Read only: the anchors are pushed with the deploy key to the anchor repository, never here.
  contents: read

concurrency:
  # Two runs committing anchors at once produce a push race, and the loser retries against
  # a moved head. One at a time, and a queued run is never worth keeping.
  group: anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run without the anchor store once an install is being anchored
        id: store
        env:
          BRAIN_URL: ${{ vars.BRAIN_URL }}
          ANCHOR_REPOSITORY: ${{ vars.ANCHOR_REPOSITORY }}
          ANCHOR_DEPLOY_KEY: ${{ secrets.ANCHOR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # No BRAIN_URL is a repository nobody has deployed, and it anchors nothing quietly.
          # BRAIN_URL without the store is an install whose anchors have nowhere to go, which
          # is the failure this workflow exists to prevent, so it is a failed run.
          if [ -z "${BRAIN_URL:-}" ]; then
            echo "no BRAIN_URL repository variable; no anchor this run"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${ANCHOR_REPOSITORY:-}" ] || [ -z "${ANCHOR_DEPLOY_KEY:-}" ]; then
            echo "::error::BRAIN_URL is set but ANCHOR_REPOSITORY or the ANCHOR_DEPLOY_KEY secret is missing, so the ledger's head has nowhere to be published"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check out the anchor repository with its deploy key
        if: steps.store.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ANCHOR_REPOSITORY }}
          ssh-key: ${{ secrets.ANCHOR_DEPLOY_KEY }}

      - name: Read the ledger head
        if: steps.store.outputs.configured == 'true'
        id: read
        env:
          BRAIN_URL: ${{ vars.BRAIN_URL }}
        run: |
          set -euo pipefail
          # The address lives in the repository variable and nowhere in these files:
          # a fallback here is one client's address inside the product's own history.
          # No variable means no anchor, which is the same answer as a site that did
          # not reply, and never a failed run for a repository nobody has deployed.
          if [ -z "${BRAIN_URL:-}" ]; then
            echo "no BRAIN_URL repository variable; no anchor this run"
            echo "taken=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --fail so a 502 is a failed step rather than an anchor file containing an
          # error page, which would verify against nothing and look like data.
          if ! curl --fail --silent --show-error --max-time 20 \
                 "$BRAIN_URL/api/audit/anchor" -o anchor.json; then
            echo "the application did not answer; no anchor this run"
            echo "taken=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c "
          import json, sys
          d = json.load(open('anchor.json'))
          for field in ('chain', 'head', 'seq', 'taken_at'):
              if field not in d:
                  sys.exit(f'anchor is missing {field}')
          if len(d['head']) != 64:
              sys.exit('head is not a sha256 digest')
          print(f\"{d['chain']} seq={d['seq']} head={d['head'][:12]}...\")
          "
          echo "taken=true" >> "$GITHUB_OUTPUT"

      - name: Check the last published head is still in the ledger
        # M24.3.3. The head published last time says entry N existed with that digest. A ledger
        # that now lacks N, or holds a different digest there, lost or rewrote entries after that
        # head was published, and a chain walk on the server cannot see it. This run is where it
        # is seen: the finding is committed beside the anchors and the run fails, so the
        # repository's owner is told by GitHub rather than by somebody remembering to look.
        id: covers
        if: steps.read.outputs.taken == 'true'
        env:
          BRAIN_URL: ${{ vars.BRAIN_URL }}
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import datetime, glob, json, os, urllib.error, urllib.request

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          published = sorted(glob.glob("anchors/*.json"))
          if not published:
              print("no earlier anchor; nothing to check against")
              out.write("missing=false\n")
              raise SystemExit(0)
          last = published[-1]
          before = json.load(open(last))
          if set(before["head"]) == {"0"}:
              print("the last anchor recorded an empty ledger; nothing to check against")
              out.write("missing=false\n")
              raise SystemExit(0)
          now = json.load(open("anchor.json"))
          url = f"{os.environ['BRAIN_URL']}/api/audit/anchor/{before['seq']}"
          try:
              with urllib.request.urlopen(url, timeout=20) as answer:
                  held = json.load(answer).get("head")
          except (urllib.error.URLError, ValueError) as exc:
              # A release without the route, or no answer: not a finding, and said so.
              print(f"entry {before['seq']} could not be asked about ({exc}); not checked")
              out.write("missing=false\n")
              raise SystemExit(0)
          if held is None or now["seq"] < before["seq"]:
              verdict = "removed"
          elif held != before["head"]:
              verdict = "rewritten"
          else:
              verdict = "held"
          print(f"entry {before['seq']} from {last}: {verdict}")
          if verdict == "held":
              out.write("missing=false\n")
              raise SystemExit(0)
          os.makedirs("anchors/findings", exist_ok=True)
          stamp = datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H%M%SZ")
          finding = {"anchor": last, "head": before["head"], "seq": before["seq"], "verdict": verdict}
          json.dump(finding, open(f"anchors/findings/{stamp}.json", "w"), sort_keys=True)
          out.write("missing=true\n")
          CHECK

      - name: Commit it
        if: steps.read.outputs.taken == 'true'
        run: |
          set -euo pipefail
          mkdir -p anchors
          # One file per day, overwritten within the day. Four anchors a day in one file
          # keeps the directory readable for years; the git history keeps every version.
          stamp="$(date -u +%Y-%m-%d)"
          mv anchor.json "anchors/$stamp.json"

          # `git status` and not `git diff`: a new day's file is untracked, and `git diff` never
          # sees an untracked file, so every new anchor was reported as "nothing to commit".
          if [ -z "$(git status --porcelain -- anchors/)" ]; then
            echo "the head has not moved since the last anchor; nothing to commit"
            exit 0
          fi

          git config user.name "brain-anchor"
          git config user.email "anchor@users.noreply.github.com"
          git add anchors/
          git commit -m "Anchor the audit ledger at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Rebase rather than merge: an anchor history full of merge commits is a history
          # nobody reads, and these commits never conflict with anything but each other.
          git pull --rebase --quiet
          git push

      - name: Fail the run when entries were removed after the last published head
        if: steps.covers.outputs.missing == 'true'
        run: |
          echo "the ledger no longer holds the entry the last published head names; see anchors/findings"
          exit 1

# Writes the status file into the repository after each merge to main whose CI passed.
#
# `docs/status.json` is computed in the Deploy build and baked into the image, and until this
# workflow it was never written back: the 2026-09-17 tracker audit reopened M38.3.1.2 for
# exactly that. This commits it, once per green CI run on main, so the history of the figure
# is in git and can be read without the server.
#
# **To the `status` branch, never to main.** A commit to main from here would start CI, whose
# success starts Deploy and this workflow again, so every merge would deploy twice and write a
# second status about the first; and main takes changes through pull requests. A branch of its
# own holds one file, `status.json`, one commit per merge, and triggers nothing: CI runs on
# pushes to main and on pull requests only.
#
# After a green CI rather than on the push, for the rule `brain.status` already keeps: a task is
# done only when its branch merged and CI is green (M38.3.1.3), so a merge whose CI failed
# writes no status and the last one written still stands.
#
# Task ids: M38.3.1.2

name: Status file

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.12.9"

concurrency:
  # Two merges close together would race to push; one at a time, and a queued run still
  # writes, because each describes a different commit.
  group: status-file
  cancel-in-progress: false

jobs:
  write:
    name: Commit status.json to the status branch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Progress is computed from the whole history; a shallow clone sees one commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate the work breakdown
        run: node docs/wbs/export.js
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Compute progress from git history
        run: |
          uv sync --locked
          uv run python -m brain.status
      - name: Commit it to the status branch
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          cp docs/status.json "$RUNNER_TEMP/status.json"
          dir="$RUNNER_TEMP/status-branch"
          # The first run finds no branch and starts it with no history of main behind it.
          if git ls-remote --exit-code --heads origin status >/dev/null; then
            git fetch --quiet origin status
            git worktree add --quiet --detach "$dir" FETCH_HEAD
          else
            git worktree add --quiet --orphan -b status "$dir"
          fi
          cp "$RUNNER_TEMP/status.json" "$dir/status.json"
          cd "$dir"
          git add status.json
          git -c user.name="brain-status" -c user.email="status@users.noreply.github.com" \
            commit --quiet -m "Status at ${SHA:0:7}"
          git push --quiet origin HEAD:refs/heads/status

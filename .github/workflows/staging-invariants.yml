name: Staging invariants

# The invariant suite, the row-level security sweep and the schema check, pointed at a staging
# database named by the STAGING_DATABASE_URL secret rather than at CI's empty one.
#
# **Run by hand only.** Every push already runs the suite against its own checkout; a job on
# every push that needs a secret most forks and clones will never have would be a red CI for a
# reason unrelated to the change. A missing secret fails the run: a skip would read as a pass.
#
# **The secret should name the brain_app login, not the owner.** Everything here only reads,
# and a credential in GitHub able to write every table is the one worth never storing.
#
# **Most of the invariant suite reads source, not the database** (measured 2026-09-11: it passes
# identically without one), so the steps that answer about staging itself are the sweep and the
# schema check. The suite runs too, so the report names the commit it judged.
#
# Task ids: M38.2.1.2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.9"

jobs:
  staging:
    name: Invariants against staging
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: The staging database is named
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::STAGING_DATABASE_URL is not set, so nothing about staging can be checked"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Invariants
        run: uv run pytest tests/invariants -q --junitxml=evidence/staging-invariants.xml
      - name: The invariant report ran every invariant and skipped none
        run: uv run python -m brain.ops.invariant_evidence evidence/staging-invariants.xml
      - name: Row-level security on every entity table, on staging
        run: uv run python -m brain.ops.sweeps rls
      - name: The staging schema is what the migrations say it is
        run: uv run python -m brain.ops.schema_check "$DATABASE_URL"
      - name: Keep the report, named for the commit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-invariants-${{ github.sha }}
          path: evidence/staging-invariants.xml
          if-no-files-found: warn
          retention-days: 90

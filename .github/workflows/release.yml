name: Release

# One archive of one tag and the image that tag pins, published where the installer can reach
# both of them.
#
# **A tag runs this workflow and nothing else, and until 2026-09-16 that meant a release with
# no image in it.** `Deploy` is triggered by `CI` completing on `main`, `CI` runs on a push to
# `main` and on a pull request, and a tag push is neither, so nothing in this repository ever
# published `<product image>:<release tag>`. The installer's seventh step writes exactly that
# reference into a client's environment file and its tenth step pulls it, so the first real
# release would have been fetched, unpacked, configured, and then stopped at the pull against
# a tag nobody had ever created. The `image` job below is that half, and `archive` waits for
# it so no client can fetch an archive pinning an image that is not there.
#
# Nothing about what a client receives is written in this file. The file list, the refusals,
# where the migrations live and the notes all come from `brain.deployment.release`, and the
# module header argues why: an exclusion list written here would ship every file added after
# the day somebody wrote it, and a list written in two places is two lists that agree until
# one of them is edited. `tests/unit/test_deployment_release.py` asserts that this file spells
# no path the archive carries or refuses.
#
# Task ids: M42.3.8

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build the archive for
        required: true

permissions:
  contents: write

env:
  UV_VERSION: "0.12.9"

jobs:
  image:
    name: The release tag names the image CI built
    runs-on: ubuntu-latest
    permissions:
      # Narrower than the workflow's `contents: write`, which this job has no use for. The
      # registry write is what moves a tag onto an existing manifest; nothing here signs, so
      # no `id-token` either. See the promote step for why the signature is already made.
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      repository: ${{ steps.name.outputs.repository }}
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # One commit is enough here: this job asks what commit the tag names and nothing
          # about the history in front of it. The archive job needs the whole of it and says
          # why there.
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - id: name
        name: The image name, asked of the module rather than written here
        # Four files named this image and disagreed after a rename, which is why it is declared
        # once and read. A fifth copy in this file would be the same defect with a longer fuse:
        # a release publishing to a package no install pulls goes green from both ends.
        run: |
          echo "repository=$(uv run python -m brain.deployment.release image-repository)" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3.7.0

      - id: promote
        name: Verify what CI built for this commit, then put the release tag on it
        env:
          REPOSITORY: ${{ steps.name.outputs.repository }}
          # The two constraints cosign is given, out here rather than in the command, because
          # the issuer's host name contains `.git` as a substring and the test that refuses an
          # archive path spelled in this file reads the commands and matches on text.
          IDENTITY: ^https://github.com/${{ github.repository }}/
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          commit=$(git rev-parse HEAD)
          digest=""
          # The deploy workflow tags with `git rev-parse --short HEAD`, whose length is
          # whatever git thought unambiguous on the day that build ran. The repository grows,
          # so the same command run later can answer one character longer and this job would
          # look for a tag nothing ever pushed. Ask the registry about every length that
          # command could have produced rather than pick one and be right most of the time.
          for n in 7 8 9 10 11 12; do
            short=$(printf "%s" "$commit" | cut -c "1-$n")
            found=$(docker buildx imagetools inspect "$REPOSITORY:$short" \
                      --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$found" ]; then
              digest="$found"
              echo "$REPOSITORY:$short is $digest"
              break
            fi
          done
          if [ -z "$digest" ]; then
            echo "::error::no image at $REPOSITORY for commit $commit."
            echo "::error::Only Deploy publishes one, and only for a commit whose CI passed."
            echo "::error::Wait for CI and Deploy on that commit, then run this workflow again."
            exit 1
          fi
          # Before the tag is moved, never after. A release tag on an unsigned digest is a
          # client running an artefact with no signature over it, and withdrawing a tag a server has
          # already pulled is not a thing this repository can do.
          cosign verify "$REPOSITORY@$digest" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "the digest is signed by a workflow of ${{ github.repository }}"
          # A registry-side manifest copy: a second name on one digest, so the signature made
          # at build time still covers what the release tag resolves to. Building again here
          # would produce a second digest from the same source, unsigned, untested, and
          # indistinguishable from the first by anything a client can see.
          docker buildx imagetools create --tag "$REPOSITORY:$TAG" "$REPOSITORY@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: The release tag resolves to the digest that was verified
        env:
          REPOSITORY: ${{ steps.name.outputs.repository }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        # A create that reported success and left the tag pointing somewhere else is the one
        # failure this job cannot see from the inside, and it is asked of the registry rather
        # than of the command that just ran.
        run: |
          landed=$(docker buildx imagetools inspect "$REPOSITORY:$TAG" \
                     --format '{{.Manifest.Digest}}')
          [ "$landed" = "$DIGEST" ] || {
            echo "::error::$REPOSITORY:$TAG is $landed, not the verified $DIGEST"
            exit 1
          }
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest \`$DIGEST\`, signed and verified" >> "$GITHUB_STEP_SUMMARY"

  archive:
    name: Publish the archive and its notes
    runs-on: ubuntu-latest
    # An archive is what a client fetches, and it pins the image by tag. Published first, it
    # would be a working download of a release that cannot start, and the person who finds
    # that out is standing at somebody else's server.
    needs: image
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Full history and every tag. The notes are computed against the release before
          # this one, and a shallow clone has no previous tag to compute against: it would
          # report a release carrying migrations as carrying none, which is the one sentence
          # in the notes a client acts on.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - name: What the archive would carry, and everything wrong with it
        # Before the tar and not after. A missing bind-mount source or a client value in a
        # carried file is a release that must not be published, rather than one to withdraw
        # once somebody has installed it.
        run: uv run python -m brain.deployment.release gaps

      - name: The file list, asked of the module rather than written here
        run: uv run python -m brain.deployment.release files > "$RUNNER_TEMP/files.txt"

      - name: Build the archive
        # One top-level directory, because the installer unpacks with --strip-components=1.
        # Sorted and with ownership zeroed so two builds of one tag are the same bytes.
        run: |
          tar -czf "$RUNNER_TEMP/brain-$TAG.tar.gz" --sort=name --owner=0 --group=0 \
            --numeric-owner --transform "s,^,brain-$TAG/," -T "$RUNNER_TEMP/files.txt"

      - name: The archive is that list and nothing else
        # The list is an allowlist, so this cannot fail on today's declaration. It is here for
        # the day somebody adds a flag to the command above: a build that quietly carried one
        # more file than it was asked for would look exactly like this one.
        run: |
          tar -tzf "$RUNNER_TEMP/brain-$TAG.tar.gz" | sed "s,^brain-$TAG/,," | sort \
            > "$RUNNER_TEMP/inside.txt"
          sort "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/asked.txt"
          diff "$RUNNER_TEMP/asked.txt" "$RUNNER_TEMP/inside.txt"

      - name: The notes, in plain English, with the database answer derived
        # The tag message is what the person tagging wrote: an `Urgency:` line and one line per
        # thing that changed. Everything else is computed. The directory to diff comes from the
        # module for the same reason the file list does.
        run: |
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/message.txt"
          where=$(uv run python -m brain.deployment.release migrations-path)
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            git diff --name-only --diff-filter=A "$previous" "$TAG" -- "$where" \
              > "$RUNNER_TEMP/added.txt"
          else
            git ls-tree -r --name-only "$TAG" -- "$where" > "$RUNNER_TEMP/added.txt"
          fi
          xargs uv run python -m brain.deployment.release notes "$TAG" \
            "$RUNNER_TEMP/message.txt" < "$RUNNER_TEMP/added.txt" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--verify-tag`, because `gh release create` creates the tag at the head of the
        # default branch when the one it is given does not exist. On the dispatch path a
        # mistyped tag would then publish a release of whatever main happened to be, under a
        # name nobody chose, and every check in this run would have passed.
        #
        # The installer script goes beside the archive as well as inside it. It is the one
        # thing a client needs *before* the archive, since running it is what fetches the
        # archive, so a copy that is only inside is a download you need in order to download it.
        #
        # Found in the file list the module already printed rather than named here, for the
        # reason nothing else in this file names a path: the declaration decides where the
        # script lives, and a second spelling would go on publishing an asset from a path that
        # had moved. Absent, the release is still publishable and still installable by hand
        # from the guide the archive carries, and the summary says so rather than the person
        # finding out at the terminal.
        #
        # The Windows helper and its launcher go beside it for the same reason: they are how a
        # person who does not use a terminal runs the installer, so they are needed before the
        # archive too. Found in the same list, and absent is not a failure for the same reason.
        # See brain.deployment.windows_helper.
        run: |
          script=$(grep -E '(^|/)install\.sh$' "$RUNNER_TEMP/files.txt" | head -n 1 || true)
          set -- "$RUNNER_TEMP/brain-$TAG.tar.gz"
          if [ -n "$script" ]; then
            set -- "$@" "$script"
          else
            echo "### No installer script in this release" >> "$GITHUB_STEP_SUMMARY"
            echo "This tag carries no rendered installer, so the install is the step table" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "in the install guide this archive carries, followed by hand." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          helpers=$(grep -E '(^|/)install-from-windows\.(ps1|cmd)$' "$RUNNER_TEMP/files.txt" || true)
          for helper in $helpers; do
            set -- "$@" "$helper"
          done
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "$@"

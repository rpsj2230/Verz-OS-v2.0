# The automation canvas, deployed as a sandbox rather than as a member of the stack.
#
# `brain.ops.automation` is the boundary this file has to build. Its opening paragraph is
# the whole design: the canvas runs flows a client's own staff assemble, so the code inside
# it is written by somebody outside this repository and is treated as hostile. No database
# URL, no vault token, no provider key, and an egress allowlist rather than an open network.
#
# **Everything below is that policy expressed as a deployment, and the two are compared by
# `tests/unit/test_automation_deployment.py`.** A boundary that exists only as a Python
# constant is a boundary nothing enforces, which is the same argument `ops/wiring.py` makes
# about memory limits and the same gap that left the tool registry unbuilt until yesterday.
#
# **Its own network, and that is the load-bearing line in this file.** `automation` is
# `internal: true`, so nothing on it reaches the internet at all. The canvas therefore
# cannot call `api.xero.com` directly however its flows are written; it reaches a source
# only through the egress proxy, which is the one place `EGRESS_ALLOWLIST` is applied. An
# allowlist checked inside the sandbox is an allowlist the sandbox can edit.
#
# **It is not on the application's network either.** Putting it there would let a flow reach
# `db:5432` and `cache:6379` by hostname, and the credentials being absent is then the only
# thing standing between an assembled flow and the database. Two defences are better and the
# network one is the one that holds when somebody adds an environment variable in a hurry.
#
# **It keeps its own database and is given no credential to ours.** Activepieces needs
# somewhere to store flows. That is `automation-db`, on the internal network, with a password
# that exists only for it. The application's `POSTGRES_PASSWORD` is deliberately not
# interpolated anywhere in this file, and a test asserts that it is not: an environment
# variable is one line, and one line is how a sandbox stops being one.
#
# **Off unless somebody said otherwise.** `brain.ops.automation.enabled_for` refuses a
# non-boolean because `"false"` is truthy in Python, in JavaScript and in the YAML a compose
# environment section produces. This file is a separate compose file rather than a service
# with a profile flag for the same reason: not composing it is unambiguous, and a client who
# has not been asked has not agreed.
#
# **The canvas can now reach us, and only us.** Until 2026-09-06 this container could talk
# to the allowlisted sources and could not talk to this application at all, which
# `brain.ops.automation_piece` called the safe half of the arrangement and not the useful
# half. Item 30 of `docs/needs-rupash.md` decided between the two ways of closing that: a
# second Docker network carrying the application and the canvas alone, or the application's
# public hostname added to the egress allowlist. The owner chose the network, and asked
# whether it cost anything: it does not, because a Docker network is a named route between
# containers that already exist rather than a machine.
#
# The `tool-api` network below is that decision. It carries the application and this
# service, so `db` and `cache` have no name on it to resolve, and the second defence the
# docstring above argues for is intact: this is not the application's `default` network
# with a friendlier name. It is internal as well, since 2026-09-15: a non-internal network
# is a route out, and a second route out beside the proxy is the one thing this file exists
# to deny.
#
# **The TypeScript piece** is built by `ops/automation/piece` (strict tsc against
# pieces-framework 0.7.42, loaded by its test/load.test.ts) and uploaded through the canvas
# API; see that directory's README. What it contains is fully determined by
# `brain.ops.automation_piece`: a step naming a tool and a bag of arguments, and no address.
#
# Task ids: M32.6.1.1

services:
  activepieces:
    image: activepieces/activepieces:0.39.5
    restart: unless-stopped
    depends_on:
      automation-db:
        condition: service_healthy
    networks:
      # Internal, and never `default`. See the file docstring.
      - automation
      # The route to our own tool API, added 2026-09-06 when the owner chose it over
      # sending the traffic out to the public hostname and back in. It carries the
      # application and this service and nothing else, so what this reaches is one HTTP
      # API, not the stack: `db` and `cache` have no name on this network to resolve.
      #
      # This is not a hole in the sandbox, because of what is on the other end.
      # `brain.ops.automation_piece` is the only thing a step can call, a `PieceStep` has
      # no field for an address, and the reach of the call is
      # `E(caller) intersected with the flow's ceiling` computed by `flow_reach`. So the
      # canvas reaching us is the canvas reaching the gate, which is the arrangement the
      # whole module was built for. The alternative, no route at all, is what
      # `automation_piece.py` calls the safe half and not the useful half.
      - tool-api
    environment:
      AP_ENGINE_EXECUTABLE_PATH: /usr/src/app/dist/packages/engine/main.js
      AP_ENVIRONMENT: prod
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
      AP_FRONTEND_URL: ${AUTOMATION_PUBLIC_URL}
      # Its own store, on the internal network. Never the application's.
      AP_POSTGRES_HOST: automation-db
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: ${AUTOMATION_DB_PASSWORD}
      AP_QUEUE_MODE: MEMORY
      AP_ENCRYPTION_KEY: ${AUTOMATION_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AUTOMATION_JWT_SECRET}
      # Every outbound request goes through the proxy, which is where the allowlist lives.
      # Set here rather than trusted to the flow author, and the internal network means a
      # flow that unsets them reaches nothing rather than reaching everything.
      HTTP_PROXY: http://automation-egress:3128
      HTTPS_PROXY: http://automation-egress:3128
      # `app` is the application on `tool-api`. Without it a client that honours these
      # variables, which the framework's axios-based HTTP client does, sends the tool call to
      # the proxy, and the proxy refuses it because the application is not an allowlisted
      # host. A client that ignores them, which Node's `fetch` does, reaches `app` directly.
      NO_PROXY: app,automation-db,automation-egress,localhost,127.0.0.1
      AP_TELEMETRY_ENABLED: "false"
    expose:
      - "80"
    deploy:
      resources:
        limits:
          # Matches the `activepieces` component in `brain.ops.wiring`, which is where the
          # budget is decided and what every profile's arithmetic is computed from.
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/flags"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  # The only route out. `EGRESS_ALLOWLIST` in `brain.ops.automation` is the source of truth
  # and `ops/automation/egress.conf` is generated from it; a test holds the two equal.
  #
  # Exact hostnames, never suffixes. `automation.py` records why at length: a suffix check
  # admits `notapi.lark.com`, because that string genuinely ends with `api.lark.com`, so any
  # host somebody can register whose name ends in the right characters is allowed through.
  automation-egress:
    image: ubuntu/squid:6.10-24.04_edge
    restart: unless-stopped
    networks:
      - automation
      - egress
    volumes:
      # **Absolute, and of the four settings files this is the one that mattered most.**
      # `./ops/automation/egress.conf` is resolved against the directory the compose file was
      # read from, and the deployment path this system uses stores its own copy with no
      # repository beside it: docker creates an empty directory there and squid starts with a
      # configuration nobody wrote. The allowlist is the only thing between an assembled flow
      # and the internet, and a proxy with no allowlist looks exactly like one that has it.
      # `/opt/brain/settings` is created and filled by the installer; see
      # `brain.deployment.installer.INSTALL_SETTINGS` and `settings_not_created`.
      - /opt/brain/settings/automation/egress.conf:/etc/squid/squid.conf:ro
    expose:
      - "3128"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  automation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - automation
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: ${AUTOMATION_DB_PASSWORD}
    volumes:
      - automation-db:/var/lib/postgresql/data
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activepieces -d activepieces"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  # No internet. A flow that resolves a hostname on this network gets nowhere, whatever it
  # was told to call, which is what makes the proxy the only route rather than the polite one.
  automation:
    internal: true
  # The proxy alone sits on both. This is the only service in the file that can reach out.
  egress:
  # The application's network, declared here exactly as `docker-compose.yml` declares it.
  #
  # **Not `external`, and that was a defect rather than a style.** This file is never
  # composed on its own: `full` composes it after `docker-compose.yml` into one project, and
  # Compose merges a top-level network key across `-f` files with the later file winning.
  # `external: true` here therefore turned the application's declaration into a reference
  # to a network nothing in the project creates, so `full` on a clean host could not start.
  # Compose also rejects any attribute beside `name` on an external network, so the
  # `internal: true` the application's side now carries could not have been merged with it.
  #
  # Restating the declaration is safe only while the copies agree, so
  # `tests/unit/test_compose_networks.py` holds every declaration of one network name equal.
  tool-api:
    name: brain-tool-api
    internal: true

volumes:
  automation-db:

# Keycloak: the identity provider the whole system's permission model rests on.
#
# **This did not exist, and its absence was the real reason nobody could sign in.**
# `ops/keycloak/realm-export.json` is a carefully argued realm with seventeen tests holding
# it to its claims, `ops/keycloak/setup.sh` is a reviewed import procedure, and neither had
# anywhere to run: there was no Keycloak in any compose file and none on the server. The
# console was built, typed and tested against a provider that has never existed.
#
# Registering the console's redirect URIs was necessary and not sufficient. This is the rest.
#
# ---------------------------------------------------------------------------------------
# Two caps, as everywhere else here, and the second one is the JVM's.
#
# | service        | cgroup | process-side          | why the gap |
# |----------------|--------|-----------------------|-------------|
# | keycloak       | 1024M  | -Xmx420m, code 96m    | metaspace, code cache, GC structures, threads |
# | keycloak-db    | 256M   | shared_buffers 64MB   | work_mem per sort, WAL buffers, the backends |
#
# A cgroup limit is enforced by the kernel killing the process, so it protects the
# neighbours and does nothing for this container. The JVM must additionally be told its own
# ceiling or it sizes the heap from the *host's* memory, is happy, and is killed by the cgroup
# while collecting.
#
# **So the heap is a fixed figure, `-Xmx420m`, and never a percentage.** This file said until
# 2026-10-06 that `MaxRAMPercentage` reads the cgroup limit rather than the host, and whether it
# does depends on the kernel the install runs on. The JDK in the Keycloak 26.0 image (21.0.6)
# decides whether the memory controller exists by reading `/proc/cgroups`, and kernels from 6.12
# built without cgroup v1 memory accounting report it there as disabled. HotSpot then logs
# "controller memory is not enabled" and sizes everything from the host. Measured with `jcmd` on
# the browser harness's runner: `MaxRAM=16766414848`, the host's memory, so 50 per cent was an
# 8 GiB heap reserved and 3.3 GiB committed inside a 1024M cgroup, and the kernel killed it at
# 1026900 kB resident on its first sign-ins. The same image on an older kernel reads its limit
# correctly, which is why one install has run for weeks on a percentage, and why it would stop
# the day that server's kernel is upgraded. The JDK's fix (JDK-8349988, in 21.0.10) stops reading
# that file. A fixed `-Xmx` does not depend on what the JVM believes about the machine on any
# kernel, and its figure can be held against the limit. See `KEYCLOAK_HEAP_IS_A_FIGURE_NOT_A_SHARE`.
#
# 420 MiB of heap beside what lives outside it. Measured with native memory tracking on the same
# run: metaspace 117 MiB committed (capped at 256m by Keycloak itself), the code cache 56 to
# 62 MiB (capped here at 96m), symbols 47 MiB, and the collector's structures, which shrink with
# the heap they describe, so about 400 MiB outside an outsized heap and less beside this one.
# `MALLOC_ARENA_MAX=2` keeps glibc from giving each of its sixty threads an arena of its own.
#
# **It was 768M at 70 per cent until 2026-10-06, and that killed every fresh install's first
# start.** The figure assumed about 150 MiB outside the heap, which is true of a Keycloak that is
# already running. A first start is not that, and the browser harness measured it on empty
# runners: with the server build in the same JVM the kernel killed it at 763692 kB resident on
# three runs of four; with the build moved to `keycloak-build` and the heap at 50 per cent, the
# changesets that create Keycloak's schema on a new database still took it to 749668 kB and it
# was killed on one run of two. The restart policy hid every one, because the second start found
# the work done. So the server has 1024M for the start that creates its schema and imports the
# realm.
#
# **And the correction to the figure #417 gave.** It said the server settles at 418 to 596 MiB.
# That was measured after the specs, once the collector had run; across the start the cgroup
# was at its limit on every run, and the kill above was the first that crossed it. The figure
# that matters is the largest anonymous memory over the whole run, which the browser harness
# now samples every second and prints.
#
# ---------------------------------------------------------------------------------------
# Its own database, and that is deliberate rather than lazy.
#
# Keycloak could share the Brain's Postgres. It must not. The Brain's database holds company
# records under row-level security; Keycloak's holds credentials and sessions. One
# connection string that reaches both is one compromised component away from a system where
# the identity provider and the data it protects share a blast radius. `brain.ops.wiring`
# records it as `Wiring.NONE` for that reason: it has no connection string to this system's
# Postgres, so it cannot be misconfigured onto it.
#
# ---------------------------------------------------------------------------------------
# `start` and not `start-dev`. Development mode disables HTTPS requirements and enables an
# in-memory database, and a realm imported into one of those is a realm that vanishes on
# restart. The import is `--import-realm` against the mounted file, so what is configured
# and what is in the repository cannot drift: the file is the reviewed version and this is
# the only supported way to put it somewhere.
#
# Task ids: none
services:
  keycloak-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      # Below the cgroup limit. Postgres sizes nothing from the host, but shared_buffers is
      # the one figure that is reserved rather than used on demand, and the backends,
      # work_mem and the WAL buffers all sit on top of it.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      # Written down rather than left to the server default, which is also 4MB. An unset
      # setting is still a setting, and `brain.ops.connections` multiplies this by
      # max_connections to check the ceiling against the container's memory limit. A budget
      # that depends on somebody remembering a default is not a budget.
      - work_mem=4MB
      - -c
      - max_connections=30
    volumes:
      # One level up from `data`, and `docker-compose.yml` learned this the hard way first.
      # PostgreSQL 18 keeps its data in a major-version subdirectory so that `pg_upgrade
      # --link` never crosses a mount boundary, and mounting the old path makes it refuse to
      # start with a message about finding data in an "unused mount/volume", which reads like
      # corruption and is only convention. Measured here on 2026-09-07: this container
      # restart-looped on exactly that until the path moved.
      - keycloak-db:/var/lib/postgresql
    networks:
      - identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  keycloak-realm:
    # **The reviewed realm does not import, and this is what makes it importable.**
    # Measured on 2026-09-06 against Keycloak 26.0.8: `--import-realm` refused the file with
    # "Unrecognized field _comment (class RealmRepresentation), not marked as ignorable", and
    # the same realm with its comments stripped imported on the next run.
    #
    # It runs the application's own image so the transform is `brain.ops.realm_import`, which
    # has tests, rather than a shell one-liner in a compose file that nobody can test and
    # which would take the two legitimate comments inside `config` maps along with the rest.
    #
    # `service_completed_successfully` above rather than a healthcheck: this exits when it is
    # done, and Keycloak must not start before the file exists or it starts with no realm and
    # every sign-in fails with no cause visible near the login page.
    image: ${APP_IMAGE:?set APP_IMAGE to the image and release tag this install runs}
    restart: "no"
    command:
      - python
      - -c
      - |
        from pathlib import Path
        from brain.ops.realm_import import importable_realm
        out = Path("/out/realm-export.json")
        out.write_text(
            importable_realm(Path("/app/ops/keycloak/realm-export.json")), encoding="utf-8"
        )
        print(f"wrote {out} for --import-realm")
    # **Every install setting `brain.ops.realm_import` reads has to be passed here.** The
    # importer reads `INSTALL_OIDC_REDIRECT_URIS` through `brain.install.value_of`, which has no
    # default, and this service had no environment at all, so from 2026-09-09 the importer
    # exited 1 on every start and Keycloak, which waits for it to complete, stayed "Created" and
    # never ran. Required with `:?` so an unset value fails when the stack is composed, naming
    # the setting, rather than inside a container nobody reads the logs of.
    # `tests/unit/test_realm_importer_settings.py` holds the list to what the importer reads.
    environment:
      INSTALL_OIDC_REDIRECT_URIS: ${INSTALL_OIDC_REDIRECT_URIS:?set INSTALL_OIDC_REDIRECT_URIS}
      # Declared with a default, so a blank arrives as unset and the importer takes the default.
      INSTALL_OIDC_REALM: ${INSTALL_OIDC_REALM:-}
      # The console's client id and the brokered directory, all declared with defaults. See
      # `brain.identity.brokering`: nothing is brokered unless all four say which tenant.
      INSTALL_OIDC_CLIENT_ID: ${INSTALL_OIDC_CLIENT_ID:-}
      INSTALL_BROKERED_DIRECTORY: ${INSTALL_BROKERED_DIRECTORY:-}
      INSTALL_BROKERED_CLIENT_ID: ${INSTALL_BROKERED_CLIENT_ID:-}
      INSTALL_STAFF_SOURCE: ${INSTALL_STAFF_SOURCE:-}
      INSTALL_STAFF_SOURCE_LOCATION: ${INSTALL_STAFF_SOURCE_LOCATION:-}
    volumes:
      # Only the output. The reviewed realm arrives inside the image rather than through a
      # bind mount, because this Coolify installation deploys a stored compose with no
      # repository on disk beside it, so `./ops/...` resolves to nothing. Measured on the
      # server on 2026-09-07, not assumed. See the Dockerfile line that copies it.
      - realm-import:/out
    networks:
      - identity
    deploy:
      resources:
        limits:
          memory: 128M

  keycloak-build:
    # **Keycloak's server build, done once, in its own container, before the server starts.**
    # `start` without `--optimized` rebuilds the server for this configuration (Quarkus
    # augmentation) in the same JVM that then runs 148 database changesets and imports the
    # realm. On the browser harness's empty runners that one process was killed by the kernel in
    # the server's 768M cgroup on three runs of four (`Memory cgroup out of memory: Killed process
    # ... (java)`, anon-rss 763692 kB), and lowering the heap to 50 per cent did not help: the
    # augmentation's classes live outside the heap, and the same kill came at 771712 kB. The
    # restart policy hid it, because the second start found the build already done.
    #
    # So the build is this one-shot's whole job, under a limit of its own that is released when
    # it exits, before the server starts, and the server runs `start --optimized` and never
    # rebuilds. The build lands in the `keycloak-build` volume over `lib/quarkus`, which both
    # containers mount, so the server finds it where `--optimized` looks.
    #
    # **It builds only when what it was built for changed.** Beside the build it writes a marker
    # naming the distribution (a digest of the jar list the image ships) and every build-time
    # option, and a deploy whose marker matches exits at once without starting a JVM, so the
    # build's memory is paid on the first install and on a Keycloak upgrade, not on every
    # release. The build-time options here and on `keycloak` below must be the same, which
    # `tests/unit/test_keycloak_build.py` holds.
    #
    # Rejected: leaving the build in the server and raising its limit to cover build and schema
    # together, a peak nobody has measured; and a second published image with the build baked
    # in, which is cleaner and adds an image to every release (the follow-up, if boot time or
    # the volume ever becomes the problem).
    image: quay.io/keycloak/keycloak:26.0
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        marker=/opt/keycloak/lib/quarkus/brain-build.txt
        built_for="$$(ls /opt/keycloak/lib/lib/main | sha256sum | cut -d' ' -f1) KC_DB=$$KC_DB KC_HEALTH_ENABLED=$$KC_HEALTH_ENABLED KC_VAULT=$$KC_VAULT"
        if [ -f "$$marker" ] && [ "$$(cat "$$marker")" = "$$built_for" ]; then
          echo "keycloak-build: already built for this distribution and these options"
          exit 0
        fi
        /opt/keycloak/bin/kc.sh build
        printf '%s' "$$built_for" > "$$marker"
        # The most this container held, from its own cgroup, so the limit below is checked
        # against a measurement on every build rather than once.
        echo "keycloak-build: built, peak $$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown) bytes"
    environment:
      # Build-time options. Every one is also on `keycloak`, with the same value.
      KC_DB: postgres
      KC_HEALTH_ENABLED: "true"
      KC_VAULT: file
      # A fixed heap, for the reason the header gives the server's.
      JAVA_OPTS_APPEND: "-Xms64m -Xmx384m"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - keycloak-build:/opt/keycloak/lib/quarkus
    networks:
      - identity
    # 896M against a measured peak of 828 and 863 MiB at a 1024M limit and 839 and 849 MiB at this
    # one (its cgroup's memory.peak, page cache included). It prints its own peak on every build,
    # so a Keycloak upgrade that needs more says so in the deploy's log. It never runs beside the
    # server, which waits for it, so the host's peak is the larger of the two and not both
    # (`brain.ops.compose.A_ONE_SHOT_A_SERVICE_WAITS_FOR_NEVER_RUNS_BESIDE_IT`).
    deploy:
      resources:
        limits:
          memory: 896M

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully
      keycloak-build:
        condition: service_completed_successfully
    # `start`, never `start-dev`. See the header.
    #
    # **`--optimized`, and why it restart-looped once and does not now.** The flag tells
    # Keycloak to skip its build and use the one it finds in `lib/quarkus`. The stock
    # `quay.io/keycloak/keycloak:26.0` ships a build for its defaults, not for these options, and
    # said so on every boot: "the following build time options have values that differ from
    # what is persisted - the new values will NOT be used until another build is run: kc.db,
    # kc.health-enabled". So the container came up on a development file store with nothing
    # answering on 9000 and restart-looped on Rupash's server on 2026-09-07, and the flag was
    # removed. It is right now because `keycloak-build` above builds for exactly these options
    # into the volume mounted over `lib/quarkus`, and this service starts only after it has.
    # Without the flag, the build ran inside this container's first start and the kernel killed
    # it for memory; see `keycloak-build`.
    command: ["start", "--import-realm", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      # Keycloak's file vault, where a brokered directory's client secret is a file an operator
      # writes on the server, so the realm carries a `${vault...}` reference and never the
      # secret. Empty until somebody brokers; see docs/install/authentication.md.
      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault
      # **Bounded, because an unbounded client runs at its server's ceiling for ever.**
      # Keycloak's own default is 100 and this database admits 30, so before this line was
      # here Keycloak opened every connection the server would give it and held all thirty
      # idle within minutes of first boot. The next connection was refused, and the next
      # connection was an administrator trying to find out why: "FATAL: sorry, too many
      # clients already". The service reported healthy throughout, because for the one person
      # signed in it was.
      #
      # Fifteen against thirty leaves fifteen spare for a backup, a migration, a second
      # replica or a diagnosis. `brain.ops.connections` holds that arithmetic and a test
      # fails when a client's pool and a server's ceiling stop agreeing, which is the part
      # that was governed by nothing.
      KC_DB_POOL_MAX_SIZE: "15"
      # Two rather than zero, so the first sign-in of the day does not pay for opening a
      # connection. Small enough that an idle Keycloak is not sitting on the reserve.
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_INITIAL_SIZE: "2"
      # The bootstrap administrator. Required rather than defaulted, because a Keycloak that
      # comes up with a known password is an identity provider anybody can take over.
      #
      # **Rotate this after the first real administrator exists; do not unset it.** Both of
      # these use `:?`, so removing either from the deployment fails the next deploy with
      # "set KEYCLOAK_ADMIN" and nothing running to explain it. The earlier comment here said
      # the bootstrap admin was "used once and then removed", which described the account and
      # read as advice about the variable, and following it would have broken the stack.
      #
      # Keycloak only consults these when the realm has no administrator at all, so once a
      # real one exists the value grants nothing while it sits there. That makes it a
      # break-glass rather than dead weight: delete every administrator by accident and the
      # next restart recreates one from this. Which is exactly why it should be a fresh
      # random value stored in a password manager once bootstrap is done, rather than the one
      # somebody typed into a browser on the first day.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      # Behind the Coolify proxy, which terminates TLS. Without this Keycloak builds its
      # issuer and redirect URLs from the internal address and every one of them is wrong in
      # a way that only shows up in the browser.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      # The process-side caps, as fixed figures: see the header for why not a percentage, and
      # `tests/unit/test_wiring.py` for the sum they are held to.
      JAVA_OPTS_APPEND: "-Xms128m -Xmx420m -XX:ReservedCodeCacheSize=96m"
      MALLOC_ARENA_MAX: "2"
    volumes:
      # The build `keycloak-build` made for these options. See `--optimized` above.
      - keycloak-build:/opt/keycloak/lib/quarkus
      # The stripped copy, written by `keycloak-realm` above, never the reviewed file.
      # Read-only: a container that could write here would let a change made by clicking
      # survive a restart, which is the drift `ops/keycloak/setup.sh` exists to prevent.
      - realm-import:/opt/keycloak/data/import:ro
      - keycloak-vault:/opt/keycloak/vault:ro
    networks:
      - identity
      - proxy
    expose:
      - "8080"
    healthcheck:
      # Readiness, not liveness. `/health/ready` answers only once the realm is imported and
      # the database is reachable, which is the state a sign-in needs; `/health/live` answers
      # as soon as the JVM is up and would let the proxy send traffic to a Keycloak with no
      # realm in it.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  identity:
    # Keycloak and its database only. Nothing else on this host can reach the credential
    # store, which is the point of it being a separate network rather than the default one.
    internal: true
  proxy:
    external: true
    name: coolify

volumes:
  keycloak-db:
  keycloak-build:
  realm-import:
  keycloak-vault:

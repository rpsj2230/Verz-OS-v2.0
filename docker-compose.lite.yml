# The lite profile (M0.4.1).
#
# Every service, volume and setting here is identical to `docker-compose.yml`, and
# `tests/unit/test_repo_shape.py` is what keeps it that way. Only this header differs.
#
# The header used to claim byte-identity and a CI check. Neither was true: the files
# differed by these comment lines, and nothing anywhere compared them. That is worse than
# no claim, because the next person to edit one file reads a sentence saying the other is
# guaranteed to follow. Found by an agent reading the header while working on the memory
# budget; the check is now real and compares the parsed YAML rather than the bytes, so a
# comment may differ and a port may not.
#
# The duplication is deliberate: the architecture asks for the profiles to be named files an
# operator can point at, and Coolify deploys `docker-compose.yml` by that name. Two files
# that must agree, with nothing enforcing it, is how a profile quietly stops being the thing
# it is named after.
#
# **Lite is the whole stack minus the worker**: application, transaction pooler, database,
# cache. It is not a cut-down or development configuration; it is what a client without
# background automation runs, and it is what is running in production today.
#
# **There is no `docker-compose.full.yml`, and the reason has changed since this last said
# so.** It used to say that `full` was this stack plus a worker and a session-mode pooler,
# and that there was no worker process for the pooler to serve. There is one now:
# `docker-compose.worker.yml` runs `python -m brain.ops.worker`, and since 2026-09-16 it
# reaches Postgres through a session-mode pooler declared in that same file, which is what
# LISTEN needs. Meanwhile `full` has come to mean something larger: fourteen components in
# `brain.ops.wiring`, deployed by nine compose files, twenty-one containers between them.
#
# **It is not the memory arithmetic, and that is worth saying because it was the previous
# answer to this question.** `budget_breaches("full")` compares wave 2 against a cap measured
# on one machine, and this repository is the product rather than that machine: a client with
# a larger server runs `full`, which is what the profile is for. What the file would owe its
# reader is the size of host it needs, and `brain.ops.compose.host_mib_for` computes that at
# 13952 MiB, which is more than the measured machine holds in total.
#
# Four things stopped the file being written, every one of them a fact about the product
# rather than about anybody's server, every one computed by `brain.ops.compose` and pinned by
# `tests/unit/test_compose.py` so that fixing one fails a test rather than going unnoticed.
# Three were closed on 2026-09-10 by `docs/needs-rupash.md` item 43 and one is open.
#
# Open: `presidio-analyzer` is budgeted at 512 MiB and no compose file declares a service by
# that name. It is the one a decision about deployment files cannot close, because closing it
# means choosing an image, a port and a readiness probe for a container nobody here has run.
#
# Closed: `seaweedfs` is described once, in the object store's own file, and named with no
# body in the trace ledger's, so there is no order in which the wrong body could win.
# 0 services take something they need at startup from a bind mount that a stored compose
# resolves to nothing, because all four now name an absolute path under the install's
# settings directory. And the trace ledger still connects to a database that nothing in
# those eight files creates, which is now created by a step of the install before anything
# that needs it is started.
#
# M0.4.2 stays unclaimed until the first one is closed, and
# `THE_FULL_PROFILE_IS_NOT_ONE_FILE_YET` is this paragraph with the figures in it.

# The stack Coolify deploys.
#
# Sizing note, written down because the host it lands on is shared: that box already runs
# ~29 containers using about 4.5 GiB of 11.7 GiB, including a different live project.
# Every service below carries an explicit memory limit. Without limits, one runaway query
# in this stack would take down someone else's production.
#
# There is no migrate service. Migrations run inside the application's startup, under a
# PostgreSQL advisory lock, before readiness passes - see src/brain/migrate.py. A one-shot
# container did the job correctly but exits when it succeeds, and Coolify has no way to be
# told a container is meant to stop, so a successful migration displayed as a red "Exited"
# beside three healthy services.
#
# Task ids: M0.3.4, M0.4.1, M38.1.3

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE to the image and release tag this install runs}
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      # Through the pooler, never straight to the database. See the pgbouncer service.
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer:5432/brain
      VALKEY_URL: redis://cache:6379/0
      BRAIN_ENV: ${BRAIN_ENV:-production}
      # BRAIN_COMMIT_SHA is deliberately absent. The image bakes it in at build
      # time, and a runtime environment entry would override that with whatever
      # the deployment happens to know - which, in Coolify's case, is the literal
      # string "unknown" resolved once at save time and never updated again.
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:-}
      # Empty, DATABASE_URL above applies. Set to the brain_app login through pgbouncer and it
      # wins (brain.settings), so requests stop running as the owner. M31.4.2.
      BRAIN_DATABASE_URL: ${BRAIN_DATABASE_URL:-}
      # The image reference this container was selected by, so the application can name the
      # release it is running. Unlike BRAIN_COMMIT_SHA above there is no baked value for it
      # to override: a release tag is put on an image after it is built, so the image cannot
      # carry one. It is the variable the image line reads, resolved in the same evaluation,
      # so it describes this container even after the environment file is edited.
      # See brain.console.version_view.A_RELEASE_TAG_IS_A_NAME_GIVEN_AFTER_THE_BUILD.
      APP_IMAGE: ${APP_IMAGE:?set APP_IMAGE to the image and release tag this install runs}
      # **Every setting the application reads is named here, or it never reaches the container.**
      # A compose file hands a service the variables its `environment` names and no others, so
      # a line in the install's environment file that is not named below is a line nothing
      # reads. Until 2026-09-16 this block stopped at APP_IMAGE: the installer minted the setup
      # code into the environment file and printed it, and the container had no code to accept,
      # and the identity provider's issuer set in the same file never arrived either.
      # `brain.deployment.app_environment` derives the list from `brain.settings.Settings` and
      # `brain.install.INSTALLATION`, and `tests/unit/test_app_environment.py` fails when a
      # setting either declares is not passed here under its own name.
      #
      # `:-` and never `:?`. An unset value arrives blank and a blank is read as unset
      # (`brain.settings.A_BLANK_VARIABLE_IS_AN_UNSET_ONE`), so each takes its declared default,
      # and an install with no issuer still starts, unready for sign-in, which is how the setup
      # wizard is reached at all. The vault's pair is not here: see `docker-compose.vault.yml`.
      BRAIN_SETUP_SECRET: ${BRAIN_SETUP_SECRET:-}
      BRAIN_SETUP_ISSUED_AT: ${BRAIN_SETUP_ISSUED_AT:-}
      BRAIN_PROFILE: ${BRAIN_PROFILE:-}
      BRAIN_RUN_MIGRATIONS: ${BRAIN_RUN_MIGRATIONS:-}
      BRAIN_REQUEST_TIMEOUT_SECONDS: ${BRAIN_REQUEST_TIMEOUT_SECONDS:-}
      BRAIN_CORS_ORIGINS: ${BRAIN_CORS_ORIGINS:-}
      BRAIN_WIDGET_ORIGINS: ${BRAIN_WIDGET_ORIGINS:-}
      BRAIN_MIGRATION_DATABASE_URL: ${BRAIN_MIGRATION_DATABASE_URL:-}
      BRAIN_TOOL_SOURCE: ${BRAIN_TOOL_SOURCE:-}
      BRAIN_READ_REPLICA_URL: ${BRAIN_READ_REPLICA_URL:-}
      BRAIN_RELEASE_CHECK: ${BRAIN_RELEASE_CHECK:-}
      BRAIN_RELEASE_FEED_URL: ${BRAIN_RELEASE_FEED_URL:-}
      BRAIN_LANGFUSE_HOST: ${BRAIN_LANGFUSE_HOST:-}
      BRAIN_LANGFUSE_PUBLIC_KEY: ${BRAIN_LANGFUSE_PUBLIC_KEY:-}
      BRAIN_LANGFUSE_SECRET_KEY: ${BRAIN_LANGFUSE_SECRET_KEY:-}
      BRAIN_INFERENCE_URL: ${BRAIN_INFERENCE_URL:-}
      # This installation's own values, every one `brain.install.INSTALLATION` declares.
      INSTALL_COMPANY_NAME: ${INSTALL_COMPANY_NAME:-}
      INSTALL_PRODUCT_NAME: ${INSTALL_PRODUCT_NAME:-}
      INSTALL_LOGO_URL: ${INSTALL_LOGO_URL:-}
      INSTALL_ACCENT_COLOUR: ${INSTALL_ACCENT_COLOUR:-}
      INSTALL_SENDER_ADDRESS: ${INSTALL_SENDER_ADDRESS:-}
      INSTALL_OIDC_ISSUER: ${INSTALL_OIDC_ISSUER:-}
      INSTALL_OIDC_REALM: ${INSTALL_OIDC_REALM:-}
      INSTALL_OIDC_CLIENT_ID: ${INSTALL_OIDC_CLIENT_ID:-}
      INSTALL_OIDC_REDIRECT_URIS: ${INSTALL_OIDC_REDIRECT_URIS:-}
      INSTALL_BROKERED_DIRECTORY: ${INSTALL_BROKERED_DIRECTORY:-}
      INSTALL_BROKERED_CLIENT_ID: ${INSTALL_BROKERED_CLIENT_ID:-}
      INSTALL_STAFF_SOURCE: ${INSTALL_STAFF_SOURCE:-}
      INSTALL_STAFF_SOURCE_LOCATION: ${INSTALL_STAFF_SOURCE_LOCATION:-}
      INSTALL_MODEL_PROFILE: ${INSTALL_MODEL_PROFILE:-}
      INSTALL_MODEL_ENDPOINT: ${INSTALL_MODEL_ENDPOINT:-}
      INSTALL_EMBEDDING_DIMENSIONS: ${INSTALL_EMBEDDING_DIMENSIONS:-}
      INSTALL_EMBEDDING_REVISION: ${INSTALL_EMBEDDING_REVISION:-}
      INSTALL_OBJECT_STORE_URL: ${INSTALL_OBJECT_STORE_URL:-}
      INSTALL_OBJECT_STORE_PREFIX: ${INSTALL_OBJECT_STORE_PREFIX:-}
      INSTALL_OBJECT_STORE_BACKEND: ${INSTALL_OBJECT_STORE_BACKEND:-}
      INSTALL_VECTOR_STORE: ${INSTALL_VECTOR_STORE:-}
      INSTALL_LOCALES: ${INSTALL_LOCALES:-}
      INSTALL_CURRENCY: ${INSTALL_CURRENCY:-}
      INSTALL_TIME_ZONE: ${INSTALL_TIME_ZONE:-}
      INSTALL_LARK_USES: ${INSTALL_LARK_USES:-}
      INSTALL_LARK_PLATFORM: ${INSTALL_LARK_PLATFORM:-}
      INSTALL_LARK_BASE: ${INSTALL_LARK_BASE:-}
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      # `default` is listed because naming any network here stops Compose adding it, and
      # dropping it would cut the application off from its own database and cache. It is
      # the one entry in this file that looks redundant and is not.
      - default
      # The route the automation canvas reaches this application on, and the only route
      # it has to anything of ours. See `docker-compose.automation.yml`, which declares
      # this network and puts exactly one service on it.
      #
      # It carries this service and the canvas alone. That is what makes it different
      # from putting the canvas on `default`: on a shared network every member resolves
      # every other by hostname, so `default` would hand an assembled flow `db:5432` and
      # `cache:6379`, and the absence of credentials would be the only thing left between
      # the two. Here there is no hostname to resolve, because those services are not on
      # it.
      - tool-api
    healthcheck:
      # Readiness, not liveness. A container that is up but cannot reach its database
      # still answers questions, from whatever it can still reach.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # PgBouncer in transaction mode. The application connects here, never to db directly.
  #
  # Sizing is the point: 200 client connections against a pool of 20 means the application
  # can hold two hundred while Postgres sees twenty. Without it, max_connections=100 on a
  # box this size is reached by two app replicas and a worker.
  #
  # src/brain/session.py sets prepare_threshold=None because of this container. Transaction
  # pooling hands a different backend to every transaction, so a server-side prepared
  # statement made on one and executed on another fails - and only ever in production,
  # because development has no pooler.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: brain
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: brain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      # A login not in the userlist (the owner is) is looked up as the owner, which is how
      # brain_app gets in; a role that is a superuser or bypasses row security never does.
      # Pinned rather than left to the default. See tests/unit/test_pooler_logins.py.
      AUTH_QUERY: "SELECT rolname, CASE WHEN rolvaliduntil < now() THEN NULL ELSE rolpassword END FROM pg_authid WHERE rolname = $$1 AND rolcanlogin AND NOT rolsuper AND NOT rolbypassrls"
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U brain"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # `POSTGRES_DB` creates exactly one database on an empty data directory, so the second
      # one the trace ledger needs is created by a step of the install rather than here. It is
      # deliberately not a second variable on this service: `docker-compose.yml` is in the
      # standard profile, so a trace ledger setting written here would be a value the guide
      # then tells every standard install to set for a component it does not run. See the step
      # named "create the databases the compose files do not" in
      # `brain.deployment.installer.PLAN`, which reads it out of the install's own environment
      # file and pipes it to psql.
      POSTGRES_DB: brain
    volumes:
      # PostgreSQL 18 changed this. Earlier images took the volume at
      # /var/lib/postgresql/data; 18+ expects it one level up and keeps data in a
      # major-version subdirectory, so pg_upgrade --link never crosses a mount boundary.
      # Mounting the old path makes 18 refuse to start with a message about finding data
      # in an "unused mount/volume", which reads like corruption but is only convention.
      - brain-db:/var/lib/postgresql
    # Not published to the host. Nothing outside this compose project reaches the
    # database, which matters more than usual on a box with no firewall.
    expose:
      - "5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c autovacuum_work_mem=128MB
      -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # What Compose would have created anyway, named so the application can join it
  # explicitly alongside the one below.
  default:
  # Declared here and created by whoever brings the stack up first, so the two compose
  # files can be started in either order. `docker-compose.automation.yml` marks it
  # external and joins it by this name.
  #
  # Nothing else in this file joins it, and that is the whole boundary: a service added
  # to this network is a service the canvas can reach.
  #
  # **Internal, because the canvas is the other member.** Until 2026-09-15 it was not, and
  # Docker gives every non-internal bridge network a gateway, so the canvas had a direct
  # route to the internet beside the egress proxy. `HTTP_PROXY` did not close that: Node's
  # built-in `fetch` ignores it, so a flow using `fetch` went straight out past the
  # allowlist. On an internal network there is no gateway to go out through. The
  # application keeps its own route out on `default`, because an internal network is never
  # chosen as a container's default route.
  #
  # Declared identically in `docker-compose.automation.yml` and `docker-compose.lite.yml`.
  # `tests/unit/test_compose_networks.py` holds all three equal and holds the rule this is
  # one case of.
  tool-api:
    name: brain-tool-api
    internal: true

volumes:
  brain-db:

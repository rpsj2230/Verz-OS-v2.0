# The model server: the one process in this system that loads a machine-learning model.
#
# **This is item 31 of `docs/needs-rupash.md` as a deployment, redrawn on 2026-10-14 to fit the
# server the owner has.** Decided 2026-09-06, Option A: parsing, embedding and entity recognition
# live in a service of their own and the Brain asks it over the network. The measurement that
# decided it is the reason this file exists rather than three lines in `Dockerfile`: `docling`
# alone pulls 83 further packages including torch, 678 MB compressed and about 1.5 GB installed,
# into a container budgeted 512 MiB. Three models in three Brain containers would be three copies
# of that. This is the one copy.
#
# **It is optional and off.** It is in no profile's file list. An install names `modelserver` in
# `INSTALL_SERVICES` and a release starts it where the server measured enough memory
# (`brain.ops.overlays`), and nobody sends it work until the `model_server` feature is switched on.
#
# ---------------------------------------------------------------------------------------
# What changed on 2026-10-14, and why the numbers below are variables.
#
# This file said 3072M: three models resident at once, with a request ceiling of 64 MiB derived
# as 3072 - 2496 (weights) - 512 (runtime). Item 120 found that would not fit the owner's server
# beside the detector and the trace ledger, and the owner then said the system should not need
# more memory than the server has, with the kernel's cache counted. Two changes follow and
# `brain.ops.model_server` argues both:
#
#   * ONE PART IS LOADED AT A TIME. The five parts (layout, scanned pages, a general reader,
#     embedding, entities) are chosen one by one in `INSTALL_MODEL_PARTS`; the supervisor in the
#     container loads one, serves it, and ends its process before it loads another. The limit is
#     the base plus the largest part, never the sum.
#   * THE LIMIT IS THE INSTALL'S, NOT THE PRODUCT'S. It is worked out from the parts chosen and the
#     largest document (`INSTALL_MODEL_UPLOAD_MB`), or set by hand in `INSTALL_MODEL_MEMORY_MIB`,
#     and the release's plan costs that figure and hands it here as INFERENCE_MEMORY_MIB. The
#     default below is what the default choice (the embedding part, documents up to 25 MB) needs,
#     and `tests/unit/test_inference_deployment.py` holds it to `brain.ops.wiring`'s row.
#
# | cap | value | enforced by | what it does not cover |
# | --- | --- | --- | --- |
# | cgroup limit | INFERENCE_MEMORY_MIB, no swap | the kernel, by killing the container | nothing; it is the backstop |
# | request ceiling | INFERENCE_MAX_REQUEST_BYTES, one request at a time | the server, before a part is called | a request under the ceiling whose activations are not |
# | admission | the part's non-reclaimable need against MemAvailable | the supervisor, before a part is loaded | memory the neighbours take after the part loaded |
#
# **There is no swap for this container** (`memswap_limit` equals the limit). The owner's host
# has been using swap, and a model read back from swap is the slowest way to be wrong: it answers,
# slowly, and takes the neighbours' memory with it. A container that must not exceed its limit is
# killed at it, which `restart: unless-stopped` turns into a model loaded again, which is visible.
#
# The one cap in the runtime's own units is the thread count. `OMP_NUM_THREADS` bounds the
# intra-op pool that torch and onnxruntime size from the host's core count rather than from the
# cgroup, which is the same mistake ClickHouse makes with `/proc/meminfo`; each of those threads
# carries a workspace. `MALLOC_ARENA_MAX` is the allocator's half of the same problem and
# matters here because inference allocates and frees in large blocks.
#
# ---------------------------------------------------------------------------------------
# The network is the permission boundary, and it is the load-bearing part of this file.
#
# Everything sent here has already passed the permission layer: it is the text of a chunk
# whose row already carries the permissions `chunk_document` copied onto it, or a document its
# uploader was entitled to add. Three properties follow, and each is structural.
#
# It is on an internal network, so the text of a client's documents has no route off this host.
# It is given no connection string to the Brain's database, which `brain.ops.wiring` records as
# `Wiring.NONE` and `inference_gaps` refuses to let drift, so it cannot read a row nobody sent it.
# And it is `expose` rather than `ports`, so nothing outside this compose project can hand it text
# or read a response. What it decides is what a piece of text looks like. It is never an
# authorisation boundary, in either direction.
#
# **The address the Brain dials is this service's name**, `INSTALL_MODEL_ENDPOINT`, whose default
# is this service on the port exposed below, held to this file by `tests/unit/test_embed.py`.
# The overlay joins the application and the workers to the `inference` network.
#
# ---------------------------------------------------------------------------------------
# **The image is required and never defaulted here.** `INFERENCE_IMAGE` is required with `:?` for
# the reason `docker-compose.keycloak.yml` requires its admin password: a default here would be a
# container that starts, serves something nobody chose, and is discovered by the answers getting
# quietly worse. The release's step names it from the application's own image
# (`ops/deploy/overlays/apply.sh`), and an install that builds its own sets it in the overlays'
# environment file. The image is built from `modelserver/Dockerfile`. **It has never been built or
# started**: there is no Docker on the machine this was written on, and no weights have been
# fetched, so every figure above that is not arithmetic is a judgement, said so where it is made.
#
# Weights are put in the `inference-models` volume by `ops/deploy/overlays/modelserver.prepare.sh`
# before this starts, and mounted read-only. A server that pulls from a model hub on boot needs a
# route out, which the network below is there to deny.
#
# Task ids: M7.2.1, M7.3.3 (see `docs/wbs/progress.js` for what is proved and what is not)

services:
  inference-server:
    # Required, never defaulted. See the header.
    image: ${INFERENCE_IMAGE:?set INFERENCE_IMAGE; the release names it from the application's image}
    restart: unless-stopped
    # No `profiles:` key: the overlay's file list is what places this service, and a key would
    # hide it from the plain `up -d` the step runs.
    networks:
      # One network, internal, no default entry. A second entry here is a route off the host
      # for the text of every document this company has uploaded.
      - inference
    environment:
      # The caps, in the units this server takes. Each default is the default choice's figure,
      # and `brain.ops.model_server.environment` is what overrides every one of them.
      INFERENCE_PARTS: ${INFERENCE_PARTS:-embedding}
      INFERENCE_IDLE_SECONDS: ${INFERENCE_IDLE_SECONDS:-300}
      INFERENCE_MEMORY_MIB: ${INFERENCE_MEMORY_MIB:-1088}
      INFERENCE_UPLOAD_MB: ${INFERENCE_UPLOAD_MB:-25}
      INFERENCE_MAX_REQUEST_BYTES: ${INFERENCE_MAX_REQUEST_BYTES:-33554432}
      # What each part cannot give back while it works, in MiB, which the supervisor compares with
      # what the host can give before it loads the part (`inference_server.admit`). One per part, so
      # a host that can hold the embedding model is not refused it for a larger part it never asked
      # for. Each default is the default choice's figure.
      INFERENCE_NEED_EMBEDDING_MIB: ${INFERENCE_NEED_EMBEDDING_MIB:-416}
      INFERENCE_NEED_LAYOUT_MIB: ${INFERENCE_NEED_LAYOUT_MIB:-1288}
      INFERENCE_NEED_OCR_MIB: ${INFERENCE_NEED_OCR_MIB:-520}
      INFERENCE_NEED_TIKA_MIB: ${INFERENCE_NEED_TIKA_MIB:-776}
      INFERENCE_NEED_ENTITIES_MIB: ${INFERENCE_NEED_ENTITIES_MIB:-1408}
      INFERENCE_REQUESTS_AT_ONCE: "1"
      # Where the weights are. Fixed, not a setting: the volume below is the one place.
      INFERENCE_MODEL_DIR: /models
      # The 8-bit file `INFERENCE_MODEL_DIR` holds for the embedding part, named so that a
      # larger or smaller file is a different file in the volume rather than a different image.
      INFERENCE_EMBEDDING_MODEL: qwen3-embedding-0.6b
      INFERENCE_EMBEDDING_FILE: Qwen3-Embedding-0.6B-Q8_0.gguf
      HF_HUB_OFFLINE: "1"
      # The only ceiling here that is in the runtime's own units. See the header.
      OMP_NUM_THREADS: "2"
      MALLOC_ARENA_MAX: "2"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Read-only. A server that could write here would let a model be replaced without a
      # deploy, and a vector space that changes under a stable name is the model change
      # `brain.knowledge.embedding` says has no symptom.
      - inference-models:/models:ro
    expose:
      - "8080"
    healthcheck:
      # Readiness, not liveness, and per chosen part rather than per process. What ready means
      # here is in `brain.ops.wiring`: every part this install chose has its weights and its
      # runtime on disk and the supervisor answers. It deliberately does not load a part, because
      # a probe that loaded all of them would hold what the supervisor exists to give back.
      test: ["CMD", "python", "-m", "inference_server.ready"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    # No swap: see the header. The same figure as the limit below.
    memswap_limit: ${INFERENCE_MEMORY_MIB:-1088}M
    deploy:
      resources:
        limits:
          # The install's own figure, from `brain.ops.model_server.effective_limit_mib`; the
          # default is the `inference-server` component in `brain.ops.wiring`, which is where the
          # budget is decided and what every profile's arithmetic is computed from.
          memory: ${INFERENCE_MEMORY_MIB:-1088}M

networks:
  # No internet, and nothing else on this host. The text of a client's documents crosses this
  # network and must not cross any other; a model server that could reach out is a model
  # server that could be pointed at a hosted API by one environment variable.
  inference:
    internal: true

volumes:
  # The weights, mounted read-only above. A named volume rather than a bind mount so the
  # models survive a redeploy: they are gigabytes, and a restart that refetches them needs
  # the route out this file exists to deny.
  inference-models:

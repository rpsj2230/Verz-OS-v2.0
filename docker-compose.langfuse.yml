# The trace ledger, and the reason it is a file nobody deploys yet.
#
# This is the `full` profile's observability stack: Langfuse web, its ingest worker,
# ClickHouse behind them, a Redis for the ingest queue, and the S3-compatible store
# Langfuse v3 writes event and media blobs into.
#
# **It is not deployed on the current host and this file does not pretend otherwise.**
# `ops/DEPLOY.md` records the measurement: Langfuse documents a 25.5 GiB minimum, the box
# is 11.7 GiB, and `brain.ops.wiring.budget_breaches("full")` reports the overrun in
# megabytes rather than rounding until it agrees. The file exists so the sizing is
# reviewable before somebody deploys it, not as a claim that it runs.
#
# **Every service is capped twice, and the second cap is the one that matters.**
# A `deploy.resources.limits.memory` is a cgroup ceiling: it stops a runaway container
# taking the host down, and it does so by killing the container. It does not stop the
# process inside from sizing itself for the wrong machine. ClickHouse reads
# `/proc/meminfo`, not its cgroup, and picks cache sizes for 11.7 GiB; Node does the same
# with its old-space default. Both are then OOM-killed the first time a real query lands,
# which presents as a restart loop with nothing in the application log, because the
# process is killed rather than failing. So each service is also told its own ceiling in
# its own units, below the cgroup limit, with the difference left for the parts of the
# process that are not the heap.
#
# The pairs below are deliberate and the gap is not slack:
#
# | Service | cgroup limit | process ceiling | what the gap is for |
# | --- | --- | --- | --- |
# | langfuse-web | 512M | 384M old-space | V8 metaspace, sockets, the Node binary |
# | langfuse-worker | 384M | 288M old-space | same, smaller heap because it batches |
# | langfuse-clickhouse | 1024M | 768M server usage | mark cache, merge buffers, allocator |
# | langfuse-cache | 128M | 96M maxmemory | Redis fragmentation, which runs 1.2 to 1.5x |
#
# The fifth container of the trace stack is `seaweedfs`, and its pair is in
# `docker-compose.objectstore.yml` where the service is described. It is 256M against a
# 192MiB `GOMEMLIMIT`, for Go's non-heap: stacks, the binary and the mmap'd index.
#
# `GOMEMLIMIT` is the Go equivalent and it is a soft limit, which is the point: as the
# heap approaches it the collector runs harder instead of the kernel killing the process.
# A Go service under a cgroup limit with no `GOMEMLIMIT` collects on its own schedule,
# discovers the ceiling by being killed, and restarts with a cold index.
#
# **The `langfuse` database is created by the install, not by this file.** `POSTGRES_DB` on
# the official image creates exactly one database on an empty data directory and `db` creates
# `brain`, so until 2026-09-10 both services below pointed at a database that was never
# anybody's job to make: on a fresh install they would have failed to start with a message
# about a missing database rather than about a missing decision. The step named "create the
# databases the compose files do not" in `brain.deployment.installer.PLAN` creates the role and
# the database before anything is started, and `brain.ops.compose.databases_needed` is what
# holds the plan and these connection strings to the same answer.
#
# Its own database and its own login, rather than the `brain` database with one login covering
# both, which was the other option and is the one that puts the trace ledger's tables beside
# the company's records. See `docs/needs-rupash.md` item 43.
#
# **Why web and worker do not go through PgBouncer.** Both are wired `direct` in
# `brain.ops.wiring`, and `pooler_misuse` checks that rather than leaving it to whoever
# writes the connection string. Langfuse's migrations take session-level advisory locks
# and its ORM prepares statements server-side. Behind a transaction pooler the first is
# released by an unrelated transaction and the second fails on a backend that never saw
# the prepare. That has already cost `brain.migrate` a rewrite and `brain.session` a
# connect_arg; here it would be the same failure a third time, arriving in somebody
# else's code where our connect_args cannot reach it.
#
# **The S3-compatible store is `seaweedfs`, deliberately the same service the object
# store declares.** Langfuse v3 requires blob storage and the leaf asks for it, but a
# second S3 gateway on a host that already runs one is two copies of the same data path
# competing for the same 256 MiB. Naming the service `seaweedfs` means a project
# composing this file beside the object store gets one container rather than two. A full
# install must run exactly one, which is why it is named here rather than duplicated
# under a Langfuse prefix.
#
# **Named here and described there, since 2026-09-10.** This file used to carry a second
# body for that service, and the two disagreed: this copy had no `-s3.config` and did not
# mount the identities file, so the configuration that ran was decided by the order of the
# `-f` flags and one of the orders was an S3 gateway with no access control. Both files were
# correct read on their own, which is why nothing else here would have noticed.
#
# The two ways out are not equally good. Making the copies identical is faster and leaves two
# bodies that are equal only while a test compares them, which is a maintenance obligation
# with no end and is how a second copy becomes permanent. So the description lives in
# `docker-compose.objectstore.yml` and this file names the service with nothing under it. See
# `docs/needs-rupash.md` item 43.
#
# **Every settings file this stack mounts is now named absolutely.** Same item, first part.
# A source beginning `./` is resolved against wherever the compose file was read from, and the
# deployment path this system uses stores its own copy of a compose file with no repository
# beside it, so docker created an empty directory and started the container with none of the
# configuration the mount was carrying. `/opt/brain/settings` is created and filled by a step
# of the install; `brain.deployment.installer.settings_not_created` compares what the files
# mount against what the plan creates, in both directions.
#
# **Both services now declare a connection limit, and until 2026-09-09 neither did.**
# `DATABASE_URL` below goes straight to `db` for the reason in the pooler paragraph, so
# PgBouncer is not bounding either of them, and Langfuse runs Prisma, whose pool otherwise
# defaults to a size derived from the host's core count rather than from anything written
# here. `brain.ops.connections` calls that shape
# `AN_UNBOUNDED_CLIENT_ALWAYS_RUNS_AT_THE_SERVERS_CEILING`, and it is the shape of the
# 2026-09-07 outage: Keycloak's pool defaulted to a hundred against a server admitting thirty
# and held every connection idle. `undeclared_clients` named both of these services until the
# decision in `docs/needs-rupash.md` item 41, and `tests/unit/test_connections.py` pins that
# set, which is empty now, so the next service pointed straight at `db` fails a test.
#
# **Five each, and the two fives are not the same decision.** The interface is a trace viewer
# and is on nobody's request path, so five is what serves a browser. The worker batches
# ingestion behind one writer, so five is the batch in flight and room beside it. Prisma takes
# the figure as `?connection_limit=5` on the URL, which is why it is written into a connection
# string rather than into an environment variable of its own, and `brain.ops.connections`
# holds a `Client` row for each with the same number and the reason on the row.
#
# The arithmetic it has to fit: `db` admits 97 connections after the administrator's reserve,
# and the declared demand is now 50 of them, which is PgBouncer's 20 plus these two fives plus
# the two workers' fifteen and five. That leaves 47 spare, where it used to leave 77 with four
# services holding pools nothing had counted. The memory side binds first.
# `THE_POOLER_IS_WHAT_MAKES_THE_CEILING_SAFE` records that `db` declares 100 connections at
# 16 MiB of work_mem inside a 2048 MiB container, which is 2112 MiB at worst and is affordable
# only while real connections stay far below the ceiling: at 50 the worst case is 1312 MiB,
# and the two Prisma pools here are 160 MiB of that.
#
# **Not claimed: M32.1.1.1.** The service set is written here and has never been started
# anywhere, because there is no host it fits on. A compose file that has never run is a
# design, not a deployment, and claiming the leaf would put a tick on something nobody
# has seen work. That refusal is arithmetic rather than a sentence:
# `brain.ops.wiring.set_breaches` costs the five services below against the whole of what
# wave 2 may spend with nothing else of ours deployed, and answers 2304 MiB against 1720,
# over by 584. See `A_SET_THAT_DOES_NOT_FIT_ALONE_NEVER_FITS_BESIDE_ANYTHING`, which is why
# the answer is not "move the inference server". What is claimed is the sizing, which
# `tests/unit/test_wiring.py` checks against `brain.ops.wiring.COMPONENTS` on every run, so
# the numbers here and the numbers the budget is computed from cannot drift apart.
#
# Task ids: M32.1.1.2

services:
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-cache:
        condition: service_healthy
    environment:
      # Straight to the database. See the pooler note in this file's header.
      #
      # `connection_limit=5` is Prisma's pool maximum and it is a query parameter because that
      # is the only place Prisma reads one. Without it the pool is sized from the host's core
      # count, which on this box is a number about the machine and not about the work.
      # `brain.ops.connections` declares the matching Client row and a test holds the two
      # equal, so editing this string without editing that row fails rather than drifting.
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@db:5432/langfuse?connection_limit=5
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://langfuse-cache:6379/0
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      # Below the cgroup limit on purpose. Node sizes old-space from the host otherwise,
      # and is then killed by the cgroup rather than collecting.
      NODE_OPTIONS: "--max-old-space-size=384"
      # Telemetry to the vendor is off. This instance exists to hold traces that were
      # masked before they left our process; a usage ping from it is a second egress
      # nobody reviewed.
      TELEMETRY_ENABLED: "false"
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # Readiness, not liveness. Langfuse answers on / long before it can accept a trace,
      # and a check that passes then puts a half-migrated instance into rotation.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-cache:
        condition: service_healthy
    environment:
      # The same bound as the interface and a different reason for it: this one batches
      # ingestion behind a single writer. See the header, and the Client row that carries the
      # sentence in `brain.ops.connections`.
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@db:5432/langfuse?connection_limit=5
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: redis://langfuse-cache:6379/0
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NODE_OPTIONS: "--max-old-space-size=288"
      TELEMETRY_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      # The queue depth is the real readiness signal and there is no endpoint for it, so
      # this is the closest honest check: the worker's own health route, which answers
      # only once it has a database and a queue connection.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # The component that does not fit. A gigabyte is ClickHouse's practical floor rather
  # than a preference: below it the mark cache and the merge buffers contend, merges fall
  # behind ingest, and the symptom is query latency climbing over days rather than an
  # error anybody is paged for.
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      # Read-only, and a file rather than a shell heredoc in the command. A config built
      # by `echo` inside a YAML scalar is not reviewable, and this one decides whether
      # the server sizes itself for its cgroup or for the host.
      #
      # Absolute rather than `./ops/...`: see the header. A relative source is resolved
      # against wherever the compose file was read from, and a ClickHouse that did not get
      # this file sizes its caches for the whole host and is killed by its cgroup, which
      # presents as a restart loop with nothing in the application log.
      - /opt/brain/settings/langfuse/clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - langfuse-clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    expose:
      - "8123"
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      # A SELECT, not a ping, matching `ready_when` in `brain.ops.wiring`. ClickHouse
      # accepts connections while still replaying its log, and a TCP check passes then.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/?query=SELECT%201"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # The ingest queue. Separate from the application's `cache` service on purpose: a trace
  # backlog evicting the application's rate-limit windows would turn an observability
  # problem into a limits outage, and `allkeys-lru` cannot tell the two workloads apart.
  #
  # `noeviction` rather than `allkeys-lru` for the same reason in the other direction. A
  # full ingest queue must refuse writes and let the backlog be visible; silently dropping
  # the oldest traces produces a ledger with holes in it exactly when it is being used to
  # explain an incident.
  langfuse-cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--maxmemory",
        "96mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "",
      ]
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The S3-compatible store, named here and described in `docker-compose.objectstore.yml`.
  #
  # **The name with no body under it is the whole point.** Langfuse 3 needs an S3-compatible
  # store and the trace stack is five containers, so the dependency has to be visible in this
  # file: a reader must not have to know that another file happens to be composed alongside.
  # But a body here would be a second description of one container, and the one that ran would
  # be whichever file came later in the `-f` list. That is what this file used to be, and its
  # copy was missing `-s3.config` and the identities file, so one of the two orders started an
  # S3 gateway with no access control on it and neither file was wrong on its own.
  #
  # An empty declaration contributes nothing to the merge, so the description in the object
  # store's file wins in every order. See
  # `brain.ops.compose.A_NAME_WITH_NO_BODY_IS_A_REFERENCE_AND_NOT_A_SECOND_DECLARATION`, and
  # `COMPOSE_FILES_FOR` in `brain.deployment.requirements` for the guarantee that every profile
  # composing this file composes that one. Composing this file on its own now fails rather than
  # starting an unconfigured gateway, which is the honest outcome: the trace ledger has never
  # been a complete deployment by itself.
  seaweedfs: {}

volumes:
  langfuse-clickhouse:

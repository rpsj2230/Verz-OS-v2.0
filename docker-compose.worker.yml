# The background worker, and the two things it is capped by.
#
# `brain.ops.queue` decides what a worker may do and `brain.ops.worker` is the process that
# reads this file's environment and either lays out its processes or refuses. Everything
# below is one of those two modules expressed as a deployment, and `tests/unit/test_worker.py`
# compares them: a slot count changed here without being changed there fails, and so does a
# memory limit that stops matching `brain.ops.wiring`.
#
# **Composed on purpose, like the automation canvas.** It is a separate file rather than a
# service in `docker-compose.yml` because `brain.ops.wiring` puts `brain-worker` in the
# `standard` and `full` profiles and not in `lite`, and lite is what is deployed today. The
# `profiles:` key below carries the same two names, so `docker compose up` without one of
# them starts nothing from this file. Not composing it is unambiguous; a service that is
# present and disabled by a variable is a service somebody enables by editing the wrong line.
#
# **Capped twice, and the second cap is a different shape here than in the trace ledger.**
# `deploy.resources.limits.memory` is a cgroup ceiling: it protects the neighbour on this
# shared host, and it does so by killing the container. `docker-compose.langfuse.yml` pairs
# each of its limits with a ceiling in the process's own units - `GOMEMLIMIT` for Go,
# `--max-old-space-size` for Node - so the runtime collects harder instead of being killed.
#
# CPython has no equivalent and this file does not pretend otherwise. `RLIMIT_AS` bounds
# address space rather than heap, and a Python process given 336 MiB of address space fails
# on an ordinary import rather than on a leak. So the second cap is the number of jobs the
# process will run at once:
#
# | cap | value | enforced by | what it does not cover |
# | --- | --- | --- | --- |
# | cgroup limit | 384M | the kernel, by killing the container | nothing; it is the backstop |
# | slot budget | 7 slots x 48 MiB = 336 MiB | `brain.ops.worker.preflight`, before the first fetch | one job that leaks |
#
# 336 sits strictly below 384 for the same reason every pair in the trace ledger does: the
# quantity being capped is not the whole of what the cgroup counts. `MIB_PER_SLOT` is the
# working set of one in-flight job and the gap is the interpreter, the connection pool and
# the imports. And it is honest about what it misses: a single job that leaks is still an OOM
# kill, because nothing inside CPython will stop it. What this prevents is the ordinary
# failure, which is a slot count sized for a machine we do not have.
#
# **Capped a third time, and this one is connections rather than memory.** Both of the URLs
# below that go straight to `db` are outside PgBouncer's bound, deliberately: the queue needs
# LISTEN and the checkpointer needs server-side prepared statements, and a pooler in
# transaction mode carries neither. So the only thing bounding them is this container, and
# until 2026-09-09 nothing did. `BRAIN_WORKER_POOL_MAX` is that bound and
# `brain.ops.connections` holds the matching `Client` row, which a test compares against this
# file.
#
# | cap | value | where it is set | what it does not cover |
# | --- | --- | --- | --- |
# | checkpointer pool | 10 | `brain.session.make_worker_engine`, pool 5 plus 5 overflow | nothing; it is measured |
# | queue pool | 5 | the total below, minus the checkpointer's ten | a driver that opens outside its pool |
# | declared total | 15 | `BRAIN_WORKER_POOL_MAX` below | nothing; it is what the driver is given |
#
# **The third row stopped being a declaration on 2026-09-11 and became the figure that binds.**
# It said "it declares rather than enforces", because nothing in this repository opened a queue
# connection. `brain.ops.worker.queue_pool_max` now subtracts the checkpointer's measured ten
# from it and hands the remainder to the driver's connection pool as its maximum, so this
# number is what the container may hold rather than what somebody said it would.
#
# That subtraction is also the check nothing else can make. Removing `BRAIN_CHECKPOINTER_URL`
# below leaves the queue the whole fifteen against a budget that says five, with the total
# still correct and every other check green; the container prints that as an advisory and
# starts, because the database is still bounded at the figure it was sized for.
#
# **QUEUE_URL goes straight to the database and DATABASE_URL does not.** Both are set, and
# the worker compares them: `brain.ops.queue.queue_url_refusals` exists for the case where
# somebody gives the worker one connection string for both jobs, which is the mistake that is
# easy to write and impossible to see. A LISTEN behind the transaction pooler is moved to
# another backend and stops delivering, so the worker polls on its fallback timer, throughput
# drops to whatever that allows, and every metric reports an empty queue.
#
# **There is a step before this file now, and it is not a migration.** The queue driver ships
# and versions its own tables, so they are a deploy step rather than an Alembic revision, and
# they arrive with row-level security off. `python -m brain.ops.worker --install-queue` creates
# the schema, applies the driver's own DDL and enables row-level security on the tables that
# appeared, in that order; `--deploy-plan` prints the whole of it with the reason for each step.
# Run it once against `QUEUE_URL` before the first `docker compose up` of this file. Until it
# has run there are no queue tables, and `brain.ops.sweeps.sweep_rls` is what would say so.
#
# **It has still never been started here.** The process it runs works: it opens the pool, lays
# out one driver worker per shard at the concurrencies below, and writes the heartbeat the
# healthcheck reads. What has not happened is this file running on the host it was sized for,
# so M32.4.1.4 is not claimed, on the same grounds `docker-compose.langfuse.yml` refuses
# M32.1.1.1: a compose file that has never run is a design. Nothing registers a task either, so
# a container started today drains queues nothing enqueues onto and says so on every start.
#
# Task ids: none. M32.4.1.4 is what this serves and is deliberately not claimed; see above.

services:
  brain-worker:
    # The same image as the application. A worker is the same code with a different command,
    # and a second image would be a second build that can be one commit behind the one whose
    # jobs it is running - which presents as a task that fails only in production.
    image: ${APP_IMAGE:-ghcr.io/rpsj2230/verz-brain-v2.0:latest}
    restart: unless-stopped
    # The profiles `brain.ops.wiring` gives the `brain-worker` component, spelled the way
    # compose selects them. Held equal by test, in both directions.
    profiles: ["standard", "full"]
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "brain.ops.worker"]
    environment:
      # Straight to Postgres. Not through pgbouncer, and deliberately not the same string as
      # DATABASE_URL below: see the header, and `brain.ops.queue.queue_url_refusals`, which
      # this container runs against these two values before it starts.
      QUEUE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@db:5432/brain
      # The application's connection, through the pooler like everything else. The worker
      # makes ordinary queries on it, and reads it here so the two can be compared.
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@pgbouncer:5432/brain
      # Where a durable graph's saved state would go. Direct for a different reason from the
      # queue's: the saver prepares statements server-side, and a pooler in transaction mode
      # hands the next statement to a backend that never saw the prepare.
      BRAIN_CHECKPOINTER_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@db:5432/brain
      # The per-class allocation, one variable per class. `brain.ops.queue.CONCURRENCY` is
      # where these numbers are decided and argued; they are repeated here because a
      # container is configured by its environment, and the test holds the two equal.
      #
      # Zero for the interactive class is not an oversight. A person watching a cursor is
      # answered inside the request, and a queue in that path adds a hop whose only possible
      # effect is delay. It is set rather than omitted because an omitted class is reported
      # as one whose jobs are never fetched, and the two states must not look alike.
      BRAIN_WORKER_SLOTS_HUMAN_INTERACTIVE: "0"
      BRAIN_WORKER_SLOTS_HUMAN_ASYNC: "4"
      BRAIN_WORKER_SLOTS_AUTOMATION: "2"
      BRAIN_WORKER_SLOTS_SYSTEM: "1"
      # Which shape of container this is, which decides the queue names it drains. Standard:
      # every job here is bounded by something we wrote, so several fit inside one container.
      #
      # Set explicitly although it is also the default. This file and
      # `docker-compose.parse-worker.yml` run the same image and the same command and differ
      # in exactly two variables, and a difference expressed as one file saying something and
      # the other saying nothing is a difference nobody sees in a diff. Before this existed
      # both containers drained `system` and the general worker could fetch the 50 MiB parse
      # the parse worker was built for, into a 48 MiB slot.
      BRAIN_WORKER_SLOT_CLASS: standard
      # What this container may hold against `db`, which no pooler bounds. Ten of it is
      # measured rather than chosen: `brain.session.make_worker_engine` keeps a pool of five
      # plus five overflow for the checkpointer. The other five is the queue connection, and
      # it is the half nobody can measure until a driver exists. `brain.ops.connections`
      # declares the total as a Client row and `brain.ops.worker` compares the two before this
      # container starts, so the number here and the number the budget is computed from cannot
      # drift apart.
      BRAIN_WORKER_POOL_MAX: "15"
      # glibc gives a threaded process up to eight arenas per core and never returns them,
      # so resident memory climbs to a plateau set by the host's core count rather than by
      # the container's limit. On this box that plateau is above 384M. Two arenas costs a
      # little allocator contention and is the one memory knob CPython actually has.
      MALLOC_ARENA_MAX: "2"
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        limits:
          # Matches the `brain-worker` component in `brain.ops.wiring`, which is where the
          # budget is decided and what every profile's arithmetic is computed from.
          memory: 384M
    healthcheck:
      # Readiness, not liveness, and `brain.ops.wiring` says what it means: the queue driver
      # has fetched at least once and the database is reachable. `--ready` reads the
      # heartbeat a draining worker writes and compares its age against the same staleness
      # the re-drive sweep uses. The run mode writes that file every 15 seconds from inside
      # the loop the driver's workers run on, so a process that is alive and not scheduling
      # reports not-ready rather than healthy.
      test: ["CMD", "python", "-m", "brain.ops.worker", "--ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

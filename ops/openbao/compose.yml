# The secrets vault, deployed beside the Brain on the same host.
#
# Task ids: M31.3.2.1, M31.3.2.2
#
# Its own compose project rather than a service in the Brain's stack, so a deploy of the
# application never restarts it. Since 2026-09-29 a restart costs nothing either: the vault
# opens itself (needs-rupash 114), but a deploy that recreated it would still drop every lease
# and every connection it holds, for no reason.
#
# Nothing is published to the host. The vault listens on the container network only, and the
# Brain reaches it by service name. A vault reachable from outside is the one component where
# that would matter most.
#
# THE VAULT OPENS ITSELF, FROM A KEY FILE ONLY ROOT CAN READ. The `static` seal below encrypts
# the vault's root key with 32 random bytes the installer writes to /etc/brain-vault/seal.key,
# mode 0400, owned by root (ops/openbao/UNSEAL.md says where to keep a copy). The vault process
# runs as the image's own `openbao` user and cannot read a root-only file, so the entrypoint
# starts as root, copies the key into a tmpfs only that user can read, and hands over to the
# image's own entrypoint, which drops root as it always does. The key is never in the image,
# never in an environment variable (`docker inspect` would show it) and never on the container's
# writable layer: the tmpfs is memory and goes with the container. Measured on openbao 2.4.1 on
# 2026-09-29: the seal type reads `static`, the process runs as `openbao`, and `docker restart`
# comes back with `Sealed false` and nobody typing anything.
#
# The five `${...}` values are the defaults every install uses; they exist so the switch that
# moves an older install onto this seal (ops/openbao/switch-to-auto-unseal.sh) can bring a second
# vault up beside a running one under another name, and so its rehearsal can use throwaway ones.

name: brain-vault

services:
  vault:
    image: openbao/openbao:2.4.1
    container_name: ${BRAIN_VAULT_CONTAINER:-brain-vault}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -o openbao -g openbao -m 0700 /openbao/seal &&
        install -o openbao -g openbao -m 0400 /run/brain-vault-seal/seal.key /openbao/seal/seal.key &&
        exec /usr/local/bin/docker-entrypoint.sh server
    environment:
      # The address `bao` itself uses inside this container. Its default is https, and the
      # listener below has no TLS, so without this the healthcheck and every
      # `docker exec brain-vault bao ...` get a TLS error instead of an answer.
      BAO_ADDR: http://127.0.0.1:8200
      # No memory locking: OpenBao 2.4 dropped mlock, and 2.4.1 refuses to start with a
      # `disable_mlock` line, asking for it removed. Keeping secrets out of swap is now the
      # host's job: swap off or encrypted, a requirement the installer checks
      # (brain.deployment.requirements). Nothing locks memory, so no IPC_LOCK capability.
      #
      # The two audit devices are declared here because OpenBao 2.4 refuses `bao audit enable`
      # over the API. Declared in config, recreating the container brings them back with it.
      # The file device writes to its own volume with mode 0644 so the worker, another user,
      # can ship it (brain.ops.vault_audit_ship); the stdout device goes to the docker log, a
      # second sink that fills at a different rate, so one full disk does not stop the vault.
      # OpenBao's file device special-cases "stdout" only; "stderr" is read as a file name.
      #
      # The seal's key id is a label stored beside the vault's data. Changing it without naming
      # the old one as `previous_key_id` leaves a vault that cannot open, so it is not a setting.
      BAO_LOCAL_CONFIG: |
        storage "file" { path = "/openbao/file" }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = 1
        }
        seal "static" {
          current_key_id = "brain-seal-1"
          current_key    = "file:///openbao/seal/seal.key"
        }
        audit "file" "file" {
          options {
            file_path     = "/openbao/logs/audit.log"
            log_raw       = "false"
            hmac_accessor = "true"
            mode          = "0644"
          }
        }
        audit "file" "stdout" {
          options {
            file_path = "stdout"
            log_raw   = "false"
          }
        }
        ui = false
    volumes:
      - brain-vault-data:/openbao/file
      # The file audit device's log, on its own volume. Separate from the storage volume
      # deliberately: an audit log that fills the same disk the vault stores its data on takes
      # both out at once, and the vault refuses every request the moment it cannot write an
      # audit entry. Two volumes means a full log is a full log.
      - brain-vault-logs:/openbao/logs
      # The seal key, read-only, and refused rather than invented when it is missing: the
      # short form would have docker create an empty directory at that path and start a vault
      # that can never open.
      - type: bind
        source: ${BRAIN_VAULT_SEAL_KEY:-/etc/brain-vault/seal.key}
        target: /run/brain-vault-seal/seal.key
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /openbao/seal:size=64k
    expose:
      - "8200"
    networks:
      - brain-vault
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      # Healthy means open. Since the vault opens itself, a sealed vault is a fault (the key file
      # is missing or is not the one it was initialised with) and the status should say so.
      # Nothing restarts a container for being unhealthy under compose, so this reports and does
      # not loop. It relies on BAO_ADDR above; without it every probe is a TLS error.
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Named rather than left to the project, so the names do not depend on which project brought
  # the vault up. The defaults are the names this project has always made. The switch gives a
  # new vault its own data volume and the SAME log volume, because the worker reads the audit
  # log from that volume by name (docker-compose.vault.worker.yml) and a new name would be an
  # audit trail nobody ships.
  brain-vault-data:
    name: ${BRAIN_VAULT_DATA_VOLUME:-brain-vault_brain-vault-data}
  brain-vault-logs:
    name: ${BRAIN_VAULT_LOGS_VOLUME:-brain-vault_brain-vault-logs}

networks:
  brain-vault:
    # Joined by the application stack as an external network, so the Brain can reach the
    # vault by name without the vault being reachable from anywhere else. External here too,
    # created by the installer before the vault starts: a network owned by this project would
    # refuse a second project beside it, which is how the switch brings a new vault up.
    name: ${BRAIN_VAULT_NETWORK:-brain-vault}
    external: true

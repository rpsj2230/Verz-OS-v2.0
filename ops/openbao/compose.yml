# The secrets vault, deployed beside the Brain on the same host.
#
# Task ids: M31.3.2.1
#
# Its own compose project rather than a service in the Brain's stack, and the reason is the
# restart. `docker compose up` on the application stack restarts what it manages; if the
# vault were in that stack, every routine deploy would seal it and every deploy would need
# three people to reopen it. Separate projects means a Brain deploy leaves the vault alone.
#
# Nothing is published to the host. The vault listens on the container network only, and the
# Brain reaches it by service name. The box has ufw on and Coolify's own port already closed,
# and a vault reachable from outside is the one component where that would matter most.

name: brain-vault

services:
  vault:
    image: openbao/openbao:2.4.1
    container_name: brain-vault
    restart: unless-stopped
    environment:
      # The address `bao` itself uses inside this container. Its default is https, and the
      # listener below has no TLS, so without this the healthcheck and every
      # `docker exec brain-vault bao ...` get a TLS error instead of an answer.
      BAO_ADDR: http://127.0.0.1:8200
      # No memory locking: OpenBao 2.4 dropped mlock, and 2.4.1 refuses to start with a
      # `disable_mlock` line, asking for it removed. Keeping secrets out of swap is now the
      # host's job: swap off or encrypted, a requirement the installer checks
      # (brain.deployment.requirements). Nothing locks memory, so no IPC_LOCK capability.
      #
      # The two audit devices are declared here because OpenBao 2.4 refuses `bao audit enable`
      # over the API. Declared in config, recreating the container brings them back with it.
      # The file device writes to its own volume with mode 0644 so the worker, another user,
      # can ship it (brain.ops.vault_audit_ship); the stdout device goes to the docker log, a
      # second sink that fills at a different rate, so one full disk does not stop the vault.
      # OpenBao's file device special-cases "stdout" only; "stderr" is read as a file name.
      BAO_LOCAL_CONFIG: |
        storage "file" { path = "/openbao/file" }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = 1
        }
        audit "file" "file" {
          options {
            file_path     = "/openbao/logs/audit.log"
            log_raw       = "false"
            hmac_accessor = "true"
            mode          = "0644"
          }
        }
        audit "file" "stdout" {
          options {
            file_path = "stdout"
            log_raw   = "false"
          }
        }
        ui = false
    command: server
    volumes:
      - brain-vault-data:/openbao/file
      # The file audit device's log, on its own volume. Separate from the storage volume
      # deliberately: an audit log that fills the same disk the vault stores its data on takes
      # both out at once, and the vault refuses every request the moment it cannot write an
      # audit entry. Two volumes means a full log is a full log.
      - brain-vault-logs:/openbao/logs
    expose:
      - "8200"
    networks:
      - brain-vault
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      # 501 is "sealed", which is healthy: the container is up and waiting to be opened.
      # Treating sealed as unhealthy would restart it on a loop and no amount of unsealing
      # would stick. It relies on BAO_ADDR above; without it every probe is a TLS error.
      test: ["CMD-SHELL", "bao status 2>&1 | grep -qE 'Sealed +(true|false)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  brain-vault-data:
  brain-vault-logs:

networks:
  brain-vault:
    # Joined by the application stack as an external network, so the Brain can reach the
    # vault by name without the vault being reachable from anywhere else.
    name: brain-vault

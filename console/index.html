<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Never indexed. The console is behind a sign-in, but a static host can serve this
      shell to anyone before the redirect happens, and a search result naming a client's
      internal console is a fact about that client nobody agreed to publish.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Company Brain</title>
    <!--
      The installable shell (M35.3.2.1). Adding this makes the console installable on a
      phone and on a desktop, which is the whole of what the leaf asks for: an approval
      that arrives at eleven at night is answered from a home screen rather than from a
      browser tab somebody has to find.

      **There is no service worker and there must not be one, which is the decision this
      comment exists for.** The obvious next step after a manifest is to cache the shell for
      offline use, and every guide says to. An offline cache of this console is a copy of a
      client's data sitting on somebody's phone, readable after they leave the company and
      after their grants are revoked, and it is exactly the disclosure the whole permission
      model is built to prevent. `scripts/check-boundaries.mjs` refuses a registration, and
      the manifest deliberately declares no offline behaviour: installable and useless
      without a network is the correct pair here.

      The icons are SVG rather than PNG so there is one file per purpose and no build step
      that resizes anything. A maskable variant is separate because a platform that crops to
      a circle crops the rounded corners off the other one.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)" />
    <!--
      The theme is applied before the first paint, and it has to be here rather than in
      React. A stored preference read after hydration means the page renders in the system
      theme first and then swaps, which is the white flash every dark-mode user recognises.
      The blocking script is the trade: a few lines run synchronously in the head.

      The storage key is duplicated in src/theme/theme.ts, deliberately and unavoidably:
      this script cannot import a module and still block paint. scripts/check-boundaries.mjs
      asserts the two literals match, because a silent drift here shows up as the flash it
      exists to prevent, which nobody files a bug about.

      If a Content-Security-Policy is ever added, this script needs its hash in script-src.
      Read the README section on CSP before adding one.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("brain.console.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (err) {
          // Private windows and blocked site data both throw on access rather than
          // returning null. The correct outcome is the system theme, which is what the
          // absence of the attribute already means.
        }
      })();
    </script>
    <!--
      Which installation this console belongs to: the identity provider's issuer, the realm
      client and where the API is. Served by the application at request time from
      `brain.console_static`, never compiled in, because Vite inlines a build-time value as
      plain text and a bundle carrying one client's issuer is a bundle only that client can
      install. One image ships to every company or it is not a product.

      A blocking script rather than a fetch, and it has to stay above the module below.
      `src/config.ts` reads the global at module load and every consumer of it is
      synchronous, so an asynchronous document would mean rendering once with nothing
      configured and again with it, on every load. Two hundred bytes, uncached.

      `npm run dev` reaches the same document: `/api` is proxied to the application, and the
      application serves this path whether or not it carries a built bundle.

      The build prints `<script src="/api/console.js"> in "/index.html" can't be bundled
      without type="module" attribute`, and that is the correct outcome rather than a warning
      to clear. It is saying it has left the tag alone, which is the whole point: this file
      does not exist at build time and must not be resolved then. Adding `type="module"` would
      make Vite try to bundle a path that is served at runtime, and the build would fail.
    -->
    <script src="/api/console.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This console is a JavaScript application and there is no server-rendered version of
      it. Nothing here is available without scripting.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
